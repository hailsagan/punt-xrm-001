<style>
/* ============================================================= XRM-001
   Cross-room play · 5 UX-pattern variations · grayscale wireframe
   ============================================================= */
/* Design tokens lifted from the Punt design system (PRE-002 source).
   Light skin  = [data-punt-theme=midfi]  · Dark skin = the :root Hi-Fi theme.
   The short --ink/--panel/... aliases below keep the rest of this file working. */
:root{
  /* Hi-Fi (dark) palette — used when data-skin="brand" */
  --punt-color-bg:#0a0a0b; --punt-color-surface:#141416; --punt-color-surface-2:#1c1c20;
  --punt-color-surface-sunken:#0f0f11; --punt-color-ink:#f4f4ef; --punt-color-muted:#9b9b94;
  --punt-color-faint:#6f6f68; --punt-color-line:#f4f4ef1f; --punt-color-line-2:#f4f4ef12;
  --punt-color-brand:#b6fb6f; --punt-color-on-brand:#0a0a0b; --punt-color-danger:#ff5a36;
  --punt-color-success:#b6fb6f;
  --punt-font-body:"Hanken Grotesk",-apple-system,system-ui,sans-serif;
  --punt-font-display:"Unbounded",-apple-system,system-ui,sans-serif;
  --punt-font-mono:"JetBrains Mono",ui-monospace,monospace;
  --punt-radius-md:8px; --punt-radius-lg:12px;
  --punt-shadow-1:0 1px 2px #0006,0 1px 3px #00000052;
  --punt-shadow-2:0 4px 12px #00000070,0 12px 32px #0000008f;

  /* scale / motion (shared) */
  --punt-space-1:.25rem; --punt-space-2:.5rem; --punt-space-3:.75rem; --punt-space-4:1rem;
  --punt-space-5:1.25rem; --punt-space-6:1.5rem; --punt-space-7:2rem;
  --punt-size-control:18px; --punt-radius-sm:4px; --punt-radius-pill:999px;
  --punt-font-size-xs:.75rem; --punt-font-size-sm:.8125rem; --punt-font-size-base:1rem;
  --punt-font-size-lg:1.125rem; --punt-font-size-xl:1.375rem; --punt-font-size-2xl:1.75rem;
  --punt-font-line-tight:1.15; --punt-font-line-snug:1.3; --punt-font-line-normal:1.45;
  --punt-font-tracking-tight:-.02em; --punt-font-tracking-wide:.06em;
  --punt-ease:cubic-bezier(.2,.7,.3,1); --punt-duration-fast:.12s;
  --punt-size-container-max:1200px;

  /* semantic roles */
  --punt-text-primary:var(--punt-color-ink);
  --punt-text-secondary:var(--punt-color-muted);
  --punt-text-faint:var(--punt-color-faint);
  --punt-surface-page:var(--punt-color-bg);
  --punt-surface-default:var(--punt-color-surface);
  --punt-surface-muted:var(--punt-color-surface-sunken);
  --punt-surface-inverse:var(--punt-color-ink);
  --punt-border-subtle:var(--punt-color-line-2);
  --punt-border-default:var(--punt-color-line);
  --punt-border-strong:color-mix(in srgb, var(--punt-color-ink) 28%, transparent);
  --punt-state-hover:color-mix(in srgb, var(--punt-color-ink) 6%, transparent);
  --punt-status-success:var(--punt-color-success);
  --punt-control-track-on:var(--punt-color-brand);
  --punt-field-background:var(--punt-color-surface);
  --punt-field-border:var(--punt-border-strong);
  --punt-text-on-brand:var(--punt-color-on-brand);

  /* short aliases used throughout this prototype */
  --bg:var(--punt-color-bg); --panel:var(--punt-color-surface);
  --surface:var(--punt-color-surface-2); --surface-2:#26262b;
  --ink:var(--punt-color-ink); --ink-2:#b6b6b0;
  --muted:var(--punt-color-muted); --faint:var(--punt-color-faint);
  --line:var(--punt-color-line); --line-2:var(--punt-color-line-2);
  --line-strong:rgba(244,244,239,.26);
  --fill:var(--punt-color-ink); --on-fill:var(--punt-color-surface);
  --accent:var(--punt-color-ink); --accent-2:var(--punt-color-danger);
  --hatch:rgba(244,244,239,.08); --ring:rgba(244,244,239,.18);
  --r:10px; --r-sm:7px; --r-lg:14px;
  --mono:var(--punt-font-mono); --sans:var(--punt-font-body);
  --shadow:var(--punt-shadow-1); --shadow-lg:var(--punt-shadow-2);
}
/* LIGHT skin = the source's Mid-Fi theme (default for this prototype) */
:root:not([data-skin="brand"]){
  --punt-color-bg:#fff; --punt-color-surface:#fff; --punt-color-surface-2:#f4f4f4;
  --punt-color-surface-sunken:#f4f4f4; --punt-color-ink:#1a1a1a; --punt-color-muted:#535353;
  --punt-color-faint:#a2a2a2; --punt-color-line:#d4d4d4; --punt-color-line-2:#e4e4e4;
  --punt-color-brand:#404040; --punt-color-on-brand:#fff; --punt-color-danger:#3d3d3d;
  --punt-color-success:#626262;
  --punt-font-body:"Inter",-apple-system,system-ui,sans-serif;
  --punt-font-display:"Inter",-apple-system,system-ui,sans-serif;
  --punt-font-mono:"Roboto Mono",ui-monospace,monospace;
  --punt-radius-md:6px; --punt-radius-lg:8px;
  --punt-shadow-1:0 1px 2px #0000000f; --punt-shadow-2:0 6px 20px #0000001f;

  --surface-2:#ececec; --ink-2:#535353; --line-strong:#bcbcbc;
  --accent:var(--punt-color-ink); --accent-2:var(--punt-color-ink);
  --hatch:rgba(26,26,26,.06); --ring:rgba(26,26,26,.16);
}
/* DARK skin keeps lime as the action accent */
:root[data-skin="brand"]{
  --accent:var(--punt-color-brand); --accent-2:var(--punt-color-danger);
  --on-fill:#141416;
}
*{box-sizing:border-box}
.xrm{
  font-family:var(--sans); color:var(--ink); background:var(--panel);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased; line-height:1.45;
}

/* ---------- stage / device frame / viewport (ported from PRE-002) ---------- */
.appshell{flex:1; min-height:0; width:100%; background:var(--punt-surface-page);
  display:flex; flex-direction:column; position:relative}
.stage{flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable; background:var(--punt-surface-page)}
.stage[data-device="desktop"]{display:flex; flex-direction:column}
.stage[data-device="mobile"]{background:#17181b; display:flex; justify-content:center;
  align-items:flex-start; padding:24px 16px}
.frame{position:relative}
.frame[data-device="desktop"]{width:100%}
.frame[data-device="mobile"]{--frame-bezel:10px; --frame-screen-radius:36px;
  width:402px; max-width:100%; padding:var(--frame-bezel); background:#0b0b0c;
  border-radius:46px; box-shadow:0 0 0 2px #2a2b2f, 0 18px 50px #00000080;
  /* Establishes .frame (not .viewport) as the containing block for
     position:fixed descendants like .railfoot. It must live here, one level
     up from the scrolling element: a fixed child contained by its OWN
     scrolling ancestor still scrolls with that ancestor's content in every
     browser tested, even though it's spec-"fixed" — the containing block
     has to be a non-scrolling ancestor for "fixed" to actually stay put. */
  transform:translateZ(0)}
.viewport{background:var(--punt-surface-page); container-type:inline-size;
  display:flex; flex-direction:column}
.frame[data-device="desktop"]{flex:1 0 auto; display:flex; flex-direction:column}
.frame[data-device="desktop"] .viewport{max-width:var(--punt-size-container-max);
  margin:0 auto; width:100%; flex:1 0 auto}
.frame[data-device="mobile"] .viewport{border-radius:var(--frame-screen-radius);
  height:820px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none}
.frame[data-device="mobile"] .viewport::-webkit-scrollbar{display:none}

.scroll{display:flex; flex-direction:column; flex:1 0 auto; min-height:0}
/* Horizontal gutter matches the header's (--punt-space-4) exactly, and the
   reading-width cap is left-aligned (not auto-centered), so a sub-page's
   content lines up with the header above it instead of drifting inward. */
.pad{padding:22px var(--punt-space-4) 96px; max-width:720px; margin:0 auto}
@container (width>=40rem){ .pad{padding:34px var(--punt-space-4) 96px} }

/* two-pane on wider viewports */
.layout{display:block; width:100%; flex:1 0 auto}
.rail{display:flex; flex-direction:column; padding:22px var(--punt-space-4); border-bottom:1px solid var(--line)}
.main{display:block; padding:20px var(--punt-space-4) 96px}
@container (width>=40rem){
  .layout{display:grid; grid-template-columns:340px 1fr; gap:0; align-items:stretch}
  .layout .rail{border-right:1px solid var(--line); border-bottom:none; padding:32px var(--punt-space-4); background:var(--surface)}
  .layout .main{padding:32px var(--punt-space-4) 96px; min-width:0}
  .layout .rail.plain{background:var(--panel)}
}
/* V1 rail: three groups on an even 24px rhythm */
.rail-v1{gap:24px}
.rail-mid{display:flex; flex-direction:column}
.legcarwrap{margin-top:16px}
.legcarousel{display:flex; flex-direction:column; gap:8px}
.legdots{display:none}
/* Mobile: legs become a swipeable carousel instead of a vertical stack —
   the fixed 24px rail rhythm then naturally pulls the stake/win group up
   since this group is shorter, no extra positioning needed. */
@container (width<=40rem){
  .legcarousel{flex-direction:row; gap:10px; margin:0 calc(-1 * var(--punt-space-4)) 0;
    padding:0 var(--punt-space-4) 4px; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .legcarousel::-webkit-scrollbar{display:none}
  .legcarousel .leg{flex:0 0 85%; scroll-snap-align:center}
  .legdots{display:flex; justify-content:center; gap:6px; margin-top:12px}
}
.legdot{width:6px; height:6px; padding:0; border:0; border-radius:999px;
  background:var(--line-strong); cursor:pointer; flex:0 0 auto; transition:.15s var(--punt-ease)}
.legdot[data-on="true"]{background:var(--ink); width:16px; border-radius:3px}
/* Mobile leg detail: flatten .rail/.main so their pieces can be freely
   reordered as one flex column — progress bar first, then the rail's
   title+carousel, then the room detail content. The back button is
   dropped, and staked/to-win becomes a bar pinned to the bottom of the
   frame (via the transform-containment above) instead of scrolling. */
@container (width<=40rem){
  .layout{display:flex; flex-direction:column; gap:24px;
    padding:16px var(--punt-space-4) 260px}
  .rail{display:contents}
  .rail-mid{display:contents}
  .main{display:contents}
  /* Scrolling order: title, the carousel+dots, then this leg's detail —
     title-to-carousel and carousel-to-detail both tightened below the
     .layout's default 24px rhythm. */
  .rail-title{order:-2}
  .rail-title .h-lg{font-size:19px}
  .legcarwrap{order:-1; margin-top:-8px}
  .detail-body{margin-top:-8px}
  /* left/right/bottom inset by the bezel: .railfoot's containing block is
     .frame's full padding box (its outer edges — .frame has no CSS border,
     so padding-box == border-box here), not .viewport's edges, which sit
     one bezel-width in. 0/0/0 would bleed the bar into the bezel itself. */
  .railfoot{position:fixed; left:var(--frame-bezel,0); right:var(--frame-bezel,0);
    bottom:var(--frame-bezel,0); z-index:5;
    border-radius:0 0 var(--frame-screen-radius,0) var(--frame-screen-radius,0);
    background:var(--panel); padding:14px var(--punt-space-4);
    border-top:1px solid var(--line); box-shadow:0 -6px 16px -8px rgba(0,0,0,.15)}
  /* The room badge and CTA move into the sticky railfoot on mobile, so the
     copies rendered inline in .main are redundant there. */
  .detail-roomtag,.detail-foot{display:none}
  div.railfoot-cta{display:block; margin-top:14px; padding-top:14px;
    border-top:1px solid var(--line)}
  .railfoot-cta .successmsg{margin-top:0}
  .railfoot-cta .successmsg + .ctarow{margin-top:10px}
}
/* stake / to-win, win amount emphasized */
.railfoot{padding-top:18px; border-top:1px solid var(--line)}
.railfoot .rf-row{display:flex; align-items:center; gap:14px}
.rf-divider{width:1px; height:26px; background:var(--line); flex:0 0 auto}
.rf-stat{display:flex; align-items:baseline; gap:8px}
.rf-stat .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted)}
.rf-stat .v{font-family:var(--sans); font-size:30px; font-weight:500;
  letter-spacing:-.03em; line-height:1; color:var(--ink-2); font-variant-numeric:tabular-nums}
.rf-win .v{font-weight:700; color:var(--accent)}
/* Predict leg card — text column left, media right (stacks when narrow) */
.pcard{display:flex; gap:18px; align-items:stretch; padding:16px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.pc-info{flex:0 0 32%; min-width:0; display:flex; flex-direction:column;
  align-items:flex-start; gap:10px}
.pc-title{font-family:var(--sans); font-size:24px; font-weight:700;
  letter-spacing:-.016em; line-height:1.15; color:var(--ink)}
.pc-odds{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.pc-info .badge.live{margin-top:auto}
.pc-img{flex:1 1 0; min-width:0; align-self:stretch; min-height:200px;
  border-radius:var(--r-sm)}
/* when the fight card wraps a handstage (auto-settling), the stage takes over
   the flex-sizing role and .pc-img just fills it */
.pcard .handstage{flex:1 1 0; min-width:0; align-self:stretch; min-height:200px}
.pcard .handstage .pc-img{width:100%; height:100%; min-height:0}
@container (width<=40rem){
  .pcard{flex-direction:column; gap:14px}
  .pc-info{flex:0 0 auto}
  .pc-info .badge.live{margin-top:0}
  /* Match desktop's ~2.6:1 media ratio instead of the taller default —
     .pcard .handstage is what actually sizes the media here, since its
     .pc-img child is stretched to fill it (height:100%). */
  .pc-img{min-height:130px}
  .pcard .handstage{min-height:130px}
}

/* Collect rip — synchronized border pulse, then the winner flips */
.ripcards{display:flex; gap:10px}
.ripcard{flex:1 1 0; min-width:0; perspective:1000px; border-radius:var(--r-sm);
  transition:box-shadow .18s var(--punt-ease)}
/* one card lit at a time, sweeping left -> right; a 0.5s cycle gives
   six clean passes across the 3s rip */
.ripcards[data-phase="ripping"] .ripcard{animation:ripCycle .5s linear infinite}
.ripcards[data-phase="ripping"] .ripcard:nth-child(1){animation-delay:0s}
.ripcards[data-phase="ripping"] .ripcard:nth-child(2){animation-delay:.1667s}
.ripcards[data-phase="ripping"] .ripcard:nth-child(3){animation-delay:.3334s}
.ripcard[data-win="true"]{box-shadow:0 0 0 3px var(--accent)}
@keyframes ripCycle{
  0%{box-shadow:0 0 0 3px var(--ink)}
  33.2%{box-shadow:0 0 0 3px var(--ink)}
  33.3%{box-shadow:0 0 0 0 transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.rc-inner{position:relative; width:100%; aspect-ratio:5/7; transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ripcard[data-flipped="true"] .rc-inner{transform:rotateY(180deg)}
/* .hatch also sets position:relative — scope these so they win regardless of order */
.ripcard .rc-face{position:absolute; inset:0; backface-visibility:hidden;
  -webkit-backface-visibility:hidden; border-radius:var(--r-sm)}
.ripcard .rc-back{transform:rotateY(180deg); background-color:var(--surface-2)}
/* Play hand — table dims with a progress message while the hand runs */
.handstage{position:relative}
.hand-overlay{position:absolute; inset:0; display:grid; place-items:center;
  border-radius:var(--r-sm); background:rgba(0,0,0,.58);
  opacity:0; pointer-events:none; transition:opacity .25s var(--punt-ease)}
.handstage[data-phase="playing"] .hand-overlay{opacity:1}
.hand-msg{display:inline-flex; align-items:center; gap:10px; color:#fff;
  font-family:var(--sans); font-size:15px; font-weight:650; letter-spacing:-.01em}
.hand-msg::before{content:""; width:15px; height:15px; border-radius:50%;
  border:2px solid rgba(255,255,255,.32); border-top-color:#fff;
  animation:handSpin .8s linear infinite}
@keyframes handSpin{to{transform:rotate(360deg)}}
.reduced .hand-msg::before{animation:none}

/* success confirmation above the CTA */
.successmsg{display:flex; align-items:center; gap:9px; margin-top:16px;
  font-family:var(--sans); font-size:14px; font-weight:600; color:var(--ink)}
.successmsg .ok{width:20px; height:20px; border-radius:50%; background:var(--accent);
  display:grid; place-items:center; flex:0 0 auto}
.successmsg .ok svg{width:11px; height:11px; stroke:var(--on-fill); fill:none; stroke-width:3}
/* .detail-foot stacks the success message directly against the CTA row —
   give it breathing room so the two don't collide. */
.successmsg + .ctarow{margin-top:16px}
.reduced .ripcards[data-phase="ripping"] .ripcard{animation:none; box-shadow:0 0 0 3px var(--line-strong)}

/* two CTAs side by side */
.ctarow{display:flex; gap:10px; flex-wrap:wrap}
.ctarow .btn{flex:1 1 160px; width:auto}
.detail-foot{margin-top:20px}
/* mobile-only mirror of the CTA/success state, rendered into the sticky
   railfoot bar instead (see the width<=40rem block above) */
.railfoot-cta{display:none}


/* ---------- primitives ---------- */
.kicker{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:0 0 8px}
.h-lg{font-size:28px; font-weight:700; letter-spacing:-.022em; line-height:1.11; margin:0; text-wrap:balance}
.h-md{font-size:16.5px; font-weight:650; letter-spacing:-.012em; margin:0}
.txt{font-size:13.5px; color:var(--ink-2); margin:8px 0 0; max-width:60ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.divider{height:1px; background:var(--line); margin:16px 0; border:0}
.stack{display:flex; flex-direction:column}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.gap16{gap:16px}
.row{display:flex; align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto; min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}

/* buttons */
.btn{font-family:var(--sans); font-size:14px; font-weight:600; border-radius:9px;
  padding:13px 16px; border:1px solid var(--accent); background:var(--accent); color:var(--on-fill);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; transition:transform .12s, opacity .12s, background .15s; text-align:center}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface); opacity:1}
.btn.sm{padding:9px 13px; font-size:12.5px; width:auto; border-radius:9px}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn .m{font-family:var(--mono); font-size:12px; opacity:.75}
.btnrow{display:flex; gap:10px}
button:focus-visible,[tabindex]:focus-visible,.tap:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:8px}

/* card */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:16px}
.card.flat{box-shadow:none; background:var(--surface)}
.card.sel{border-color:var(--fill); box-shadow:0 0 0 1px var(--fill)}

/* ===== discovery landing — ported from PRE-002 source CSS ===== */
.disc{width:100%; min-width:0; max-width:var(--punt-size-container-max); margin:0 auto;
  display:flex; flex-direction:column}
/* header */
.disc-head{position:sticky; top:0; z-index:20; background:var(--punt-surface-page);
  border-bottom:1px solid var(--punt-border-strong)}
.disc-utility{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:var(--punt-space-4); padding:var(--punt-space-2) var(--punt-space-4);
  border-bottom:1px solid var(--punt-border-subtle)}
.disc-uleft{display:flex; align-items:center; gap:var(--punt-space-3); min-width:0}
.disc-search{display:flex; align-items:center; gap:var(--punt-space-2); max-width:16rem;
  min-width:0; padding-bottom:2px; border-bottom:1px solid transparent; color:var(--punt-text-secondary)}
.disc-search svg{width:15px; height:15px; stroke:var(--punt-text-primary); fill:none; stroke-width:2; flex:0 0 auto}
.disc-search span{font-size:var(--punt-font-size-sm); color:var(--punt-text-secondary)}
.disc-editions{display:flex; align-items:center; gap:var(--punt-space-5); justify-self:center}
.disc-edition{font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs); font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--punt-text-secondary);
  background:0 0; border:none; padding:0; cursor:pointer; white-space:nowrap}
.disc-edition[data-on="true"]{color:var(--punt-text-primary); font-weight:700}
.disc-account{display:flex; align-items:center; gap:var(--punt-space-2); justify-self:end}
.disc-wallet{display:inline-flex; align-items:center; gap:var(--punt-space-2);
  padding:3px var(--punt-space-3); border:1px solid var(--punt-border-subtle);
  border-radius:var(--punt-radius-pill); background:0 0; cursor:pointer; flex-shrink:0;
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs); color:var(--punt-text-primary)}
.disc-wallet svg{width:14px; height:14px; stroke:var(--punt-text-secondary); fill:none; stroke-width:2}
.disc-avatar{width:26px; height:26px; border-radius:var(--punt-radius-pill);
  background:var(--punt-surface-muted); border:1px solid var(--punt-border-subtle);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0}
.disc-avatar svg{width:14px; height:14px; stroke:var(--punt-text-secondary); fill:none; stroke-width:2}
/* masthead */
.disc-flag{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:var(--punt-space-4); padding:var(--punt-space-4) var(--punt-space-4) var(--punt-space-5)}
.disc-dateline{display:flex; flex-direction:column; gap:2px;
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs);
  color:var(--punt-text-primary); white-space:nowrap}
.disc-dateline .sub{color:var(--punt-text-secondary); text-decoration:underline}
.disc-logo{display:grid; place-items:center; color:var(--punt-text-primary)}
.disc-logo .wordmark{font-family:var(--punt-font-body); font-size:22px; font-weight:800;
  letter-spacing:-.01em; text-transform:uppercase}
.disc-quote{display:flex; justify-content:flex-end; align-items:baseline; gap:var(--punt-space-2);
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.disc-quote .l{color:var(--punt-text-secondary)}
.disc-quote .v{font-weight:700; color:var(--punt-text-primary)}
.disc-quote .m{color:var(--punt-text-secondary)}
/* category rail */
.disc-tabs{padding:0 var(--punt-space-4); background:var(--punt-surface-page);
  border-bottom:3px double var(--punt-border-strong)}
.disc-tabrow{display:flex; justify-content:center; align-items:center; gap:var(--punt-space-5);
  min-width:0; overflow-x:auto; scrollbar-width:none}
.disc-tabrow::-webkit-scrollbar{display:none}
.disc-tab{padding:var(--punt-space-3) 0; cursor:pointer; white-space:nowrap; flex:none;
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm); font-weight:600;
  color:var(--punt-text-primary); background:0 0; border:none; position:relative}
.disc-tab[data-on="true"]{font-weight:700}
.disc-tab[data-on="true"]::after{content:""; position:absolute; left:0; right:0; bottom:0;
  height:2px; background:var(--punt-text-primary)}
/* feed */
.disc-feed{display:flex; flex-direction:column; gap:var(--punt-space-4); padding:var(--punt-space-4); min-width:0}
.disc-band{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline;
  gap:var(--punt-space-3); padding-bottom:var(--punt-space-3);
  border-bottom:1px solid var(--punt-border-subtle)}
.disc-bandtitle{display:inline-flex; align-items:center; gap:var(--punt-space-2); margin:0;
  font-family:var(--punt-font-display); font-size:var(--punt-font-size-xl); font-weight:600;
  line-height:var(--punt-font-line-tight); letter-spacing:var(--punt-font-tracking-tight);
  color:var(--punt-text-primary)}
.disc-bandtitle svg{width:16px; height:16px; stroke:var(--punt-status-success); fill:none; stroke-width:2}
.disc-bandnote{font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm);
  color:var(--punt-text-secondary); font-variant-numeric:tabular-nums}
.disc-top{display:flex; gap:var(--punt-space-1); min-height:360px; min-width:0}
.disc-herowrap{flex:1 1 auto; min-width:0; display:grid}
.disc-tunerslot{flex:0 0 clamp(240px,30%,340px); display:grid; min-width:0}
@container (width<=52rem){
  .disc-top{flex-direction:column; min-height:0}
  .disc-herowrap{flex:none; min-height:360px}
  .disc-tunerslot{flex:none}
}
/* tuner */
.tuner{display:flex; flex-direction:column; gap:var(--punt-space-3); height:100%;
  padding:var(--punt-space-4); background:var(--punt-surface-default);
  border:1px solid var(--punt-border-subtle); overflow:hidden}
.tuner-head{display:flex; align-items:flex-start; gap:var(--punt-space-2); color:var(--punt-text-primary)}
.tuner-head svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; flex:0 0 auto; margin-top:1px}
.tuner-title{margin:0; font-family:var(--punt-font-body); font-size:var(--punt-font-size-base);
  font-weight:600; line-height:var(--punt-font-line-snug); color:var(--punt-text-primary)}
.tuner-sub{margin:0; font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm);
  line-height:var(--punt-font-line-snug); color:var(--punt-text-secondary); font-variant-numeric:tabular-nums}
.tuner-grid{display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr;
  gap:var(--punt-space-2); flex:1; min-height:0}
.tuner-tile{position:relative; min-width:0; border-radius:var(--punt-radius-md);
  background:var(--punt-surface-muted); border:1px solid var(--punt-border-subtle)}
.tuner-main{display:flex; flex-direction:column; gap:3px; width:100%; height:100%;
  padding:var(--punt-space-3); padding-right:calc(var(--punt-size-control) + var(--punt-space-3));
  text-align:left; background:0 0; border:none}
.tuner-tile .num{font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs);
  color:var(--punt-text-secondary); font-variant-numeric:tabular-nums; line-height:1}
.tuner-tile .nm{font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm); font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; color:var(--punt-text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1}
.tuner-tile .eg{font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs);
  color:var(--punt-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2}
.tuner-check{position:absolute; top:var(--punt-space-3); right:var(--punt-space-3);
  width:var(--punt-size-control); height:var(--punt-size-control);
  border:1px solid var(--punt-field-border); border-radius:var(--punt-radius-sm);
  background:var(--punt-control-track-on); border-color:transparent;
  display:inline-flex; align-items:center; justify-content:center; flex:none}
.tuner-check svg{width:11px; height:11px; stroke:var(--punt-text-on-brand); fill:none; stroke-width:2.4}
/* shelf */
.disc-shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  grid-auto-rows:392px; gap:var(--punt-space-1); min-width:0}
@container (width>=52rem){ .disc-shelf{grid-template-columns:repeat(4,1fr)} }
.dcard{display:flex; flex-direction:column; width:100%; height:100%; overflow:hidden;
  background:var(--punt-surface-default); border:1px solid var(--punt-border-subtle); text-align:left}
.dcard-img{position:relative; flex:0 0 132px; min-height:0; overflow:hidden}
.dcard-img .cov{position:absolute; inset:0; z-index:0; background-color:var(--punt-surface-inverse);
  background-size:cover; background-position:50%; background-repeat:no-repeat; filter:grayscale(1) contrast(1.04)}
.dcard-img .sc{position:absolute; inset:0; z-index:1;
  background:radial-gradient(120% 105% at 50% 34%,#0000 38%,#00000085 100%),
    linear-gradient(#0000000f 0%,#00000024 34%,#00000080 66%,#000000db 100%),#0000004d}
.dcard-img .tag{position:absolute; z-index:2; left:var(--punt-space-3); bottom:var(--punt-space-3)}
.dcard-body{display:flex; flex-direction:column; gap:var(--punt-space-2); flex:auto; min-height:0;
  padding:var(--punt-space-3) var(--punt-space-4) var(--punt-space-4)}
.dcard-q{margin:0; font-family:var(--punt-font-body); font-size:var(--punt-font-size-lg);
  font-weight:600; line-height:var(--punt-font-line-snug); color:var(--punt-text-primary);
  display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.dcard-meta{display:flex; align-items:center; gap:var(--punt-space-2); margin:0;
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs);
  color:var(--punt-text-secondary); font-variant-numeric:tabular-nums; line-height:1.2}
.dcard-outs{display:flex; flex-direction:column; gap:var(--punt-space-2); margin-top:auto;
  padding-top:var(--punt-space-3); border-top:1px solid var(--punt-border-subtle)}
.dout{display:flex; flex-direction:column; gap:5px}
.dout-head{display:flex; justify-content:space-between; align-items:baseline; gap:var(--punt-space-2)}
.dout-name{font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs); font-weight:600;
  color:var(--punt-text-primary)}
.dout-vals{display:inline-flex; align-items:baseline; gap:var(--punt-space-3); font-variant-numeric:tabular-nums}
.dout-mult{font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs); color:var(--punt-text-faint)}
.dout-pct{font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm); font-weight:700;
  color:var(--punt-text-primary)}
.dout-track{position:relative; width:100%; height:3px; border-radius:var(--punt-radius-pill);
  background:color-mix(in srgb, var(--punt-text-primary) 12%, transparent); overflow:hidden}
.dout-fill{position:absolute; inset:0 auto 0 0; height:100%; min-width:3px;
  border-radius:var(--punt-radius-pill); background:var(--punt-status-success)}
/* discovery — small screens */
@container (width<=34rem){
  /* search stays; only the editions nav and the flag's side columns drop */
  .disc-editions,.disc-dateline,.disc-quote{display:none}
  .disc-utility{grid-template-columns:1fr auto; gap:var(--punt-space-3)}
  .disc-account{justify-self:end}
  .disc-flag{grid-template-columns:1fr; justify-items:center;
    padding:var(--punt-space-3) var(--punt-space-4) var(--punt-space-4);
    opacity:1; max-height:200px; overflow:hidden;
    transition:max-height .28s var(--punt-ease), opacity .18s var(--punt-ease),
      padding-top .28s var(--punt-ease), padding-bottom .28s var(--punt-ease)}
  /* scrolled state — masthead collapses, utility + tabs stay pinned */
  .disc-head[data-condensed="true"] .disc-flag{opacity:0; pointer-events:none;
    max-height:0; padding-top:0; padding-bottom:0}
  .disc-logo .wordmark{font-size:17px}
  .disc-tabrow{justify-content:flex-start; gap:var(--punt-space-4)}
  .tuner-grid{grid-template-columns:1fr}
  .disc-shelf{grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); grid-auto-rows:372px}
}

/* hero / featured tile — ported from PRE-002 _tile/_hero, placeholder cover */
.hero{position:relative; display:flex; flex-direction:column; width:100%; height:100%;
  min-height:360px; overflow:hidden; border-radius:0; border:0; padding:0;
  color:#fff; cursor:pointer; text-align:left; background:var(--punt-surface-inverse)}
.hero .herocov{position:absolute; inset:0; z-index:0; background:#25272b;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 1px, transparent 1px 9px)}
.hero .heroscrim{position:absolute; inset:0; z-index:1;
  background:radial-gradient(120% 105% at 50% 34%,#0000 38%,#00000085 100%),
    linear-gradient(#0000000f 0%,#00000024 34%,#00000080 66%,#000000db 100%),#0000004d}
.hero-inner{position:relative; z-index:2; display:flex; flex-direction:column; height:100%;
  gap:var(--punt-space-4); padding:var(--punt-space-5)}
.hero-top{display:flex; justify-content:space-between; align-items:center; gap:var(--punt-space-2)}
.hero-bottom{display:flex; flex-direction:column; gap:var(--punt-space-4); margin-top:auto}
.hero-h{margin:0; color:#fff; font-family:var(--punt-font-display);
  font-size:var(--punt-font-size-2xl); font-weight:600;
  line-height:var(--punt-font-line-tight); letter-spacing:var(--punt-font-tracking-tight)}
.hero-meta{display:flex; align-items:center; gap:var(--punt-space-2); margin:6px 0 0;
  font-family:var(--punt-font-body); font-size:var(--punt-font-size-xs); color:#ffffffd1;
  font-variant-numeric:tabular-nums; line-height:1.2}
.hero-outwrap{padding-top:var(--punt-space-3); border-top:1px solid #ffffff2e;
  display:flex; align-items:flex-end; justify-content:space-between; gap:var(--punt-space-4); flex-wrap:wrap}
.hero-legs{display:flex; gap:var(--punt-space-4); flex-wrap:wrap}
.hero-leg{display:flex; flex-direction:column; gap:4px}
.hero-leg .rm{font-family:var(--punt-font-mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:#ffffff9e}
.hero-leg .pk{font-family:var(--punt-font-body); font-size:var(--punt-font-size-sm);
  font-weight:600; color:#fff}
.hero-cta{flex:0 0 auto; background:transparent; color:#fff; border:1px solid #ffffff99;
  border-radius:var(--punt-radius-md); padding:4px 12px; font-family:var(--punt-font-body);
  font-size:var(--punt-font-size-sm); font-weight:600; transition:background var(--punt-duration-fast) var(--punt-ease)}
.hero:hover .hero-cta{background:#ffffff1f}
/* live tag — ported from PRE-002 _tag (inverted variant) */
.hero-badge{display:inline-flex; align-items:center; gap:var(--punt-space-2); max-width:100%;
  padding:3px var(--punt-space-2); border-radius:var(--punt-radius-pill);
  background:#0000006b; border:1px solid #ffffff3d; color:#fff;
  font-family:var(--punt-font-mono); font-size:var(--punt-font-size-xs); font-weight:600;
  letter-spacing:var(--punt-font-tracking-wide); text-transform:uppercase; white-space:nowrap}
.hero-badge .dot{width:6px; height:6px; border-radius:var(--punt-radius-pill);
  background:var(--punt-status-success); flex-shrink:0; animation:modPulse 1.8s var(--punt-ease) infinite}
@keyframes modPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ===== mini tracker — persistent post-bet summary, floats above the review bar ===== */
.mini-tracker{position:absolute; z-index:15; display:none}
.mini-tracker[data-show="true"]{display:block}
.mini-tracker[data-device="desktop"]{right:20px; bottom:20px; width:290px}
.mini-tracker[data-device="mobile"]{position:fixed}
.mt-card{background:var(--punt-surface-default); border:1px solid var(--punt-border-subtle);
  border-radius:var(--punt-radius-lg); box-shadow:var(--punt-shadow-2); overflow:hidden;
  font-family:var(--punt-font-body); color:var(--punt-text-primary)}
.mt-head{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px;
  background:0 0; border:0; text-align:left; color:inherit; cursor:default}
.mini-tracker[data-device="mobile"] .mt-head{cursor:pointer}
.mt-dot{width:7px; height:7px; border-radius:50%; background:var(--punt-status-success);
  flex:0 0 auto; animation:modPulse 1.8s var(--punt-ease) infinite}
.mt-title{flex:1; min-width:0; font-size:var(--punt-font-size-sm); font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mt-frag{flex:0 0 auto; font-family:var(--punt-font-mono); font-size:11px;
  color:var(--punt-text-secondary); font-variant-numeric:tabular-nums}
.mt-chev{width:14px; height:14px; stroke:var(--punt-text-secondary); fill:none;
  stroke-width:2; flex:0 0 auto; transition:transform .18s var(--punt-ease); display:none}
.mini-tracker[data-device="mobile"] .mt-chev{display:block}
.mini-tracker[data-open="true"] .mt-chev{transform:rotate(180deg)}
.mt-body{padding:0 14px 14px}
.mini-tracker[data-device="mobile"][data-open="false"] .mt-body{display:none}
.mt-legs{display:flex; flex-direction:column; gap:7px; margin:2px 0 12px}
.mt-leg{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--punt-text-secondary)}
.mt-leg[data-done="true"]{color:var(--punt-text-primary)}
.mt-leg .st{width:14px; height:14px; border-radius:50%; border:1px solid var(--punt-border-strong);
  flex:0 0 auto; display:grid; place-items:center}
.mt-leg[data-done="true"] .st{background:var(--punt-status-success); border-color:var(--punt-status-success)}
.mt-leg .st svg{width:9px; height:9px; stroke:var(--punt-color-on-brand); fill:none; stroke-width:3}
.mt-stat{display:flex; gap:6px; font-family:var(--punt-font-mono); font-size:11px;
  color:var(--punt-text-secondary); margin-bottom:10px; font-variant-numeric:tabular-nums}
.mt-cta{width:100%; background:var(--punt-color-brand); color:var(--punt-color-on-brand);
  border:0; border-radius:var(--punt-radius-md); padding:9px; font-family:inherit;
  font-size:12.5px; font-weight:600; cursor:pointer}
.mt-cta:hover{opacity:.9}

/* leg-card image placeholder: square, left-aligned, 8px inset from card edges */
.legimg{flex:0 0 auto; align-self:stretch; margin:-6px 0 -6px -6px; border-radius:var(--r-sm)}

/* room tag + icon */
.rtag{display:inline-flex; align-items:center; gap:5px; padding:3px 7px; white-space:nowrap;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line-2); border-radius:6px; color:var(--ink-2); background:var(--panel)}
.rtag svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.7; flex:0 0 auto}
.rtag.solid{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
/* LIVE marker sized off .rtag so it matches the room tag's height */
.rtag.livetag::before{content:""; width:6px; height:6px; border-radius:50%; flex:0 0 auto;
  background:var(--punt-status-success); animation:modPulse 1.8s var(--punt-ease) infinite}
.reduced .rtag.livetag::before{animation:none}
.ricon{width:26px; height:26px; border-radius:8px; border:1px solid var(--line-2);
  display:grid; place-items:center; flex:0 0 auto; background:var(--panel)}
.ricon svg{width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.7}
.ricon.solid{background:var(--fill); border-color:var(--fill)}
.ricon.solid svg{stroke:var(--on-fill)}

/* hatch placeholder */
.hatch{background-image:repeating-linear-gradient(45deg,var(--hatch) 0 1px,transparent 1px 7px);
  border:1px solid var(--line); border-radius:var(--r-sm); position:relative}
.hatch .lbl{position:absolute; inset:auto 8px 8px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.08em; color:var(--muted); text-transform:uppercase}
.portrait{width:100%; aspect-ratio:1/1; border-radius:var(--r-sm)}
.hatch.r-media{aspect-ratio:16/9; width:100%; max-height:240px}
.hatch.r-card{aspect-ratio:5/7}

/* leg row (persistent play) */
.leg{display:flex; gap:12px; align-items:center; padding:13px; border-radius:11px; color:var(--ink);
  border:1px solid var(--line); background:var(--panel); position:relative; transition:.18s}
.leg .body{min-width:0; flex:1 1 auto}
.leg .ttl{font-size:13.5px; font-weight:560; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.leg .sub{font-size:11.5px; color:var(--muted); margin-top:1px; font-family:var(--mono)}
.leg .st{flex:0 0 auto}
@container (width<=40rem){
  /* Longer sub copy (e.g. "Land the Pereira rookie") wraps to a 2nd line on
     narrow cards, making that row taller — and since .legimg is squared off
     to match its own row's height (see syncLegImgs), its thumbnail ends up
     a different size than a single-line row's. Truncate to one line so
     every leg row — and thumbnail — matches. */
  .leg .sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
}
.leg[data-s="locked"]{border-style:dashed; opacity:.6}
.leg[data-s="ready"]{border-color:var(--line-strong)}
.leg[data-s="ready"]::before{content:""; position:absolute; inset:-1px; border-radius:12px;
  box-shadow:0 0 0 2px var(--ring); animation:pulse 2s infinite; pointer-events:none}
.leg[data-s="done"]{background:var(--surface)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.tick{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center}
.tick svg{width:12px; height:12px; stroke:var(--on-fill); fill:none; stroke-width:2.4}
.tick.done{background:var(--accent); border-color:var(--accent)}
.tick.lock svg{stroke:var(--muted); stroke-width:1.7}
.stepnum{font-family:var(--mono); font-size:11px; color:var(--muted); width:22px; height:22px;
  border:1px solid var(--line-2); border-radius:50%; display:grid; place-items:center}

/* multiplier meter */
.meter{display:flex; gap:4px; align-items:stretch; height:9px; margin-top:6px}
.meter i{flex:1; background:var(--surface-2); border-radius:3px; overflow:hidden; position:relative}
.meter i.on{background:var(--fill)}
.meter i.bonus{flex:.7; background:transparent; border:1px dashed var(--line-strong)}
.meter i.bonus.on{background:var(--accent); border-color:var(--accent); border-style:solid}

/* stat / payout */
.payline{display:flex; align-items:baseline; gap:10px; font-family:var(--mono); font-variant-numeric:tabular-nums}
.payline .big{font-family:var(--sans); font-size:44px; font-weight:700; letter-spacing:-.03em; color:var(--accent); line-height:1}
.payline .was{font-size:14px; color:var(--muted); text-decoration:line-through}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.stat{border:1px solid var(--line); border-radius:11px; padding:12px}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:var(--mono); font-size:19px; font-weight:640; margin-top:5px; font-variant-numeric:tabular-nums}
.stat.hero{background:var(--accent); border-color:var(--accent)}
.stat.hero .k{color:var(--on-fill); opacity:.62}
.stat.hero .v{color:var(--on-fill)}

/* stake stepper */
.stepper{display:flex; align-items:center; border:1px solid var(--line-2); border-radius:11px; overflow:hidden}
.stepper button{width:44px; height:44px; border:0; background:var(--panel); color:var(--ink);
  font-size:19px; cursor:pointer; font-family:var(--mono)}
.stepper button:hover{background:var(--surface)}
.stepper .val{flex:1; text-align:center; font-family:var(--mono); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums}
.stepper.sm{width:100%}
.stepper.sm button{width:34px; height:34px; font-size:16px; flex:0 0 auto}
.stepper.sm .val{flex:1; font-size:15px; padding:0 6px}
.stakesplit{display:flex; align-items:stretch; gap:20px}
.stakecol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center}
.stakediv{width:1px; background:var(--line); flex:0 0 auto}
/* Stake + CTA pinned to the bottom of the scroll — same idea as .railfoot
   on the leg-detail pages. Sticky on desktop (its own scrolling ancestor,
   #stage, makes this trivial); mobile switches to fixed + bezel inset,
   the same containing-block technique .railfoot uses. */
.buildfoot{position:sticky; bottom:0; z-index:5; margin-top:16px;
  padding-top:16px; background:var(--punt-surface-page);
  border-top:1px solid var(--line); box-shadow:0 -6px 16px -8px rgba(0,0,0,.15)}
@container (width<=40rem){
  .buildfoot{position:fixed; left:var(--frame-bezel,0); right:var(--frame-bezel,0);
    bottom:var(--frame-bezel,0); margin-top:0;
    border-radius:0 0 var(--frame-screen-radius,0) var(--frame-screen-radius,0);
    padding:16px var(--punt-space-4)}
  .pad{padding-bottom:240px}
}

/* success modal — overlays the bet detail view once every leg has landed */
.modalscrim{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
.modalcard{width:100%; max-width:400px; background:var(--panel); border-radius:var(--r-lg);
  padding:32px 28px 28px; box-shadow:var(--shadow-lg); text-align:center}
.modal-msg{margin:0 0 24px; font-family:var(--sans); font-size:24px; font-weight:700;
  letter-spacing:-.02em; color:var(--ink)}
.modal-rollup{margin-bottom:28px; padding-bottom:24px; border-bottom:1px solid var(--line)}


/* pill / badge */
.badge{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 8px; border-radius:100px; border:1px solid var(--line-2); color:var(--ink-2)}
.badge.solid{background:var(--accent); color:var(--on-fill); border-color:var(--accent)}
.badge.live{border-color:var(--ink); color:var(--ink); display:inline-flex; gap:6px; align-items:center}
.badge.live::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent-2); animation:pulse 1.4s infinite}
.countdown{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-2)}

/* why-note (inline product transparency) */
.why{border:1px solid var(--line); border-left:2px solid var(--ink); border-radius:9px;
  padding:11px 13px; background:var(--surface); font-size:12px; color:var(--ink-2); margin-top:14px}
.why b{color:var(--ink); font-weight:600}

/* enter animation */
.anim{animation:enter .34s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}

/* timeline (V3) */
.timeline{display:flex; align-items:center; gap:0; margin:14px 0 4px}
.timeline .node{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative}
.timeline .node::after{content:""; position:absolute; top:11px; left:50%; width:100%; height:1.5px; background:var(--line-2); z-index:0}
.timeline .node:last-child::after{display:none}
.timeline .dot{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line-2);
  background:var(--panel); z-index:1; display:grid; place-items:center; font-family:var(--mono); font-size:9px}
.timeline .dot.on{background:var(--fill); border-color:var(--fill); color:var(--on-fill)}
.timeline .dot.now{border-color:var(--ink); box-shadow:0 0 0 3px var(--ring)}
.timeline .cap{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:var(--muted)}

/* station card (V3) */
.station{border:1px solid var(--line); border-radius:var(--r); padding:15px; background:var(--panel); position:relative}
.station.up{border-color:var(--ink); box-shadow:var(--shadow)}
.station.dim{opacity:.55}

/* V3 interstitial — confirms the step you just took, auto-dismisses */
.interstitial{margin-top:16px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  padding:18px 18px 20px; position:relative; overflow:hidden; cursor:pointer}
.interstitial .ib-top{display:flex; align-items:center; gap:10px}
.ib-badge{width:30px; height:30px; border-radius:50%; background:var(--accent); display:grid; place-items:center; flex:0 0 auto}
.ib-badge svg{width:15px; height:15px; stroke:var(--on-fill); fill:none; stroke-width:2.6}
.ib-delta{display:flex; align-items:baseline; gap:8px; margin-top:15px; font-family:var(--mono); font-variant-numeric:tabular-nums}
.ib-delta .d{font-size:22px; font-weight:700; color:var(--accent); letter-spacing:-.01em}
.ib-delta .t{font-size:12px; color:var(--muted)}
.ib-next{display:flex; align-items:center; gap:9px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2)}
.ib-next svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; flex:0 0 auto}
.ib-hint{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:14px}
.ib-prog{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--surface-2)}
.ib-prog i{display:block; height:100%; background:var(--accent); transform-origin:left; animation:ibprog 2.8s linear forwards}
@keyframes ibprog{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* puck (V5) */
.roomstage{position:relative; min-height:calc(100vh - 62px); display:flex; flex-direction:column}
.roombg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:40px; text-align:center; color:var(--muted)}
.roombg .big-icon{width:66px; height:66px; border:1px dashed var(--line-2); border-radius:18px; display:grid; place-items:center}
.roombg .big-icon svg{width:32px; height:32px; stroke:var(--faint); fill:none; stroke-width:1.4}
.puck{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; width:min(460px,calc(100vw - 32px));
  background:var(--panel); border:1px solid var(--line-strong); border-radius:18px; box-shadow:var(--shadow-lg);
  padding:15px 16px; cursor:pointer; transition:transform .2s; z-index:40}
.puck:hover{transform:translateX(-50%) translateY(-2px)}
.puck.sheet{cursor:default}
.sheetgrip{width:34px; height:4px; border-radius:3px; background:var(--line-2); margin:-4px auto 12px}
.puck-legs{display:flex; gap:6px; margin-top:10px}
.puck-legs i{flex:1; height:5px; border-radius:3px; background:var(--surface-2)}
.puck-legs i.on{background:var(--fill)}
.puck-legs i.now{background:var(--fill); animation:pulse 1.6s infinite}

/* conviction ring (V4) */
.convo{display:flex; align-items:center; gap:14px}
.ring{width:74px; height:74px; flex:0 0 auto; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-weight:680; font-size:15px}
.ways{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.way{display:flex; gap:11px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:11px}
.way[data-s="locked"]{border-style:dashed; opacity:.55}
.way[data-s="done"]{background:var(--surface)}

/* toast */
.toast{position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px);
  background:var(--fill); color:var(--on-fill); font-size:12.5px; font-weight:500;
  padding:10px 16px; border-radius:100px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:.25s; z-index:60; font-family:var(--mono); letter-spacing:.02em; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%)}


/* ---------- review bar (ported verbatim from PRE-002 harness) ---------- */
.devtools{display:flex; flex-wrap:wrap; flex-shrink:0; align-items:center; gap:14px 20px;
  padding:10px 16px; background:#16171a; color:#c9ccd3; border-top:1px solid #2c2e33;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; position:relative; z-index:60}
.rb-toggle{display:none}
.rb-controls{display:contents}
.rb-brand{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:#6b6f78; white-space:nowrap}
.rb-group{display:flex; align-items:center; gap:8px}
.rb-grouplabel{font-size:11px; color:#7d818b; white-space:nowrap}
.rb-seg{display:inline-flex; gap:2px; padding:2px; background:#0e0f12;
  border:1px solid #2c2e33; border-radius:8px}
.rb-seg button{display:inline-flex; align-items:center; gap:5px; padding:5px 10px;
  font:inherit; font-size:12px; color:#b7bac1; background:0 0; border:none;
  border-radius:6px; cursor:pointer; white-space:nowrap}
.rb-seg button:hover{color:#fff}
.rb-seg button[data-on="true"]{color:#fff; background:#2f3238}
.rb-seg button:focus-visible{outline:2px solid #5b8cff; outline-offset:1px}
.rb-seg button svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2}
.rb-action{display:inline-flex; align-items:center; gap:6px; padding:6px 11px;
  font:inherit; font-size:12px; color:#b7bac1; background:#0e0f12;
  border:1px solid #2c2e33; border-radius:8px; cursor:pointer; white-space:nowrap;
  text-decoration:none}
.rb-action:hover{color:#fff; border-color:#3a3d44}
.rb-action[data-on="true"]{color:#fff; background:#2f3238}
.rb-action:focus-visible{outline:2px solid #5b8cff; outline-offset:1px}
.rb-action svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2}
.rb-right{margin-left:auto; display:flex; align-items:center; gap:14px}
/* collapsed sheet on small windows — matches the reference harness */
@media (max-width:700px){
  .devtools{position:fixed; right:12px; bottom:12px; left:auto; width:auto;
    padding:0; gap:0; background:0 0; border:none; z-index:60}
  .rb-toggle{display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; background:#16171a; color:#c9ccd3; border:1px solid #2c2e33;
    border-radius:999px; cursor:pointer; box-shadow:0 6px 18px #00000073}
  .rb-toggle svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2}
  .rb-controls{display:none}
  .devtools[data-open="true"] .rb-controls{display:flex; flex-direction:column;
    align-items:stretch; gap:14px; position:fixed; left:12px; right:12px; bottom:68px;
    max-height:72vh; overflow-y:auto; padding:16px; background:#16171a;
    border:1px solid #2c2e33; border-radius:12px; box-shadow:0 10px 30px #0000008c}
  .rb-right{margin-left:0}
}

/* V1 combo builder — leg controls + suggestions */
.legctl{display:flex; gap:5px; flex:0 0 auto}
.icbtn{width:27px; height:27px; border:1px solid var(--line-2); border-radius:7px; background:var(--panel);
  color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.14s; padding:0}
.icbtn:hover{border-color:var(--line-strong); color:var(--ink); background:var(--surface)}
.icbtn:disabled{opacity:.32; cursor:not-allowed}
.icbtn svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8}
.icbtn.active{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.leg.swapping{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink)}
.suggest{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line-strong)}
.suggest-h{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.suggrid{display:flex; gap:10px; margin-top:10px; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:-4px}
.suggrid::-webkit-scrollbar{height:5px}
.suggrid::-webkit-scrollbar-track{background:transparent}
.suggrid::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:3px}
.sug{display:flex; align-items:center; gap:12px; flex:0 0 258px; min-width:0; scroll-snap-align:start; text-align:left; cursor:pointer; color:var(--ink);
  background:var(--panel); border:1px dashed var(--line-2); border-radius:11px; padding:13px; transition:.14s}
.sug:hover{border-style:solid; border-color:var(--line-strong); background:var(--surface)}
.sug-b{flex:1 1 auto; min-width:0}
.sug-t{display:block; font-size:13px; font-weight:560; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sug-s{display:block; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:1px}
.sug-add{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; font-weight:600;
  border:1px solid var(--line-2); border-radius:100px; padding:4px 10px; color:var(--ink-2); margin-top:8px; transition:.14s}
.sug:hover .sug-add{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.sug-add.swap svg{width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2}
.hint-cap{font-size:10.5px; color:var(--muted); margin-top:10px; padding-left:2px}
.reduced *{animation:none !important}
</style>

const S={v:"v1",
  v1:{stage:"landing",stake:ENTRY,active:null,done:{PRE:false,COL:false,PLY:false},placed:false,legs:["PRE","COL","PLY"],mk:{PRE:0,COL:0,PLY:0},swapping:null,trackerOpen:false,colPhase:"idle",plyPhase:"idle",prePhase:"awaiting"},
  v2:{step:0}, // 0 pre, 1 pre-hit, 2 col, 3 col-hit, 4 ply, 5 done
};
let ripT=null, handT=null, preT=null;
function reset(v){
  if(v==="v1"){clearTimeout(ripT);clearTimeout(handT);clearTimeout(preT);preT=null;}
  if(v==="v1")S.v1={stage:"landing",stake:ENTRY,active:null,done:{PRE:false,COL:false,PLY:false},placed:false,legs:["PRE","COL","PLY"],mk:{PRE:0,COL:0,PLY:0},swapping:null,trackerOpen:false,colPhase:"idle",plyPhase:"idle",prePhase:"awaiting"};
  if(v==="v2")S.v2={step:0};
}

/* ---------- V1 combo helpers ---------- */
function mkt(c){return MARKETS[c][(S.v1.mk&&S.v1.mk[c])||0];}
function comboMult(legs){return legs.reduce((m,c)=>m*mkt(c).mult,1);}
function toWin(stake,legs){return Math.round(stake*comboMult(legs)*(legs.length>=3?1.15:1));}

/* ---------- shared components ---------- */
function meter(count,bonus){
  return `<div class="meter">
    <i class="${count>=1?'on':''}"></i><i class="${count>=2?'on':''}"></i><i class="${count>=3?'on':''}"></i>
    <i class="bonus ${bonus?'on':''}"></i></div>`;
}
function tick(state){
  if(state==="done")return `<span class="tick done">${IC.check}</span>`;
  if(state==="locked")return `<span class="tick lock">${IC.lock}</span>`;
  return `<span class="stepnum">${state}</span>`;
}
function legRow(code,state,idx){
  const l=PLAY.legs[code];
  const st=state==="done"?"done":state==="locked"?"locked":"ready";
  const mark=state==="done"?tick("done"):state==="locked"?tick("locked"):tick(idx);
  return `<div class="leg" data-s="${st}">
    ${legimg()}
    <div class="body">
      ${roomtag(code)}
      <div class="ttl">${l.title}</div>
      <div class="sub">${l.sub}</div>
    </div>

  /* A leg reads as satisfied once its room's outcome has landed — the rail card
     and the tracker segment both key off this so they can't drift apart.

  legMet(c){

      ||(c==="COL"&&s.colPhase==="revealed")||(c==="PLY"&&s.plyPhase==="won");

  active(){
    const s=S.v1, cnt=s.legs.filter(c=>s.done[c]).length, all=cnt===s.legs.length;
    /* Always land on a leg — the selected one if still open, else the next
       unresolved. Removes the old "nothing selected" empty state. */
    const cur=(s.active&&!s.done[s.active]) ? s.active : (s.legs.find(c=>!s.done[c])||s.legs[0]);
    const legs=s.legs.map((c)=>{

    /* Computed here (not just inside roomPanel) so the sticky railfoot can
       show its own mobile-only copy of the current leg's CTA/success state. */
    const cta=this.legCTA(cur), successHTML=this.legSuccessMsg(cur);
    const rail=`<div class="rail rail-v1">
      <div class="rail-mid">
        <div class="rail-title">
          <span class="kicker">Featured Combo-play</span>
          <h2 class="h-lg mt8">The Pereira Run</h2>
        </div>
        <div class="legcarwrap">
          <div class="legcarousel">${legs}</div>
          <div class="legdots">${legdots}</div>
        </div>
      </div>
      <div class="railfoot">
        <div class="rf-row">
          <div class="rf-stat"><span class="k">Staked</span><span class="v">$${s.stake}</span></div>
          <div class="rf-divider"></div>
          <div class="rf-stat rf-win"><span class="k">To win</span><span class="v">$${toWin(s.stake,s.legs)}</span></div>
        </div>
        <div class="railfoot-cta">${successHTML}${this.ctarow(cur,cta)}</div>
      </div>
    </div>`;
    return appbar(cur)+`<div class="scroll"><div class="layout">${rail}${this.roomPanel(cur)}</div></div>`

  },
  roomPanel(c){
    const s=S.v1, m=mkt(c);
    /* Predict and Collect copy are finalized; Play keeps its placeholder body
       text and secondary CTA until its own content pass. */
    /* Collect rip sequence: idle -> ripping (3s synchronized border pulse)
       -> revealed (winning card flips to the Pereira rookie). */
    const phase=s.colPhase||"idle", WIN=1;
    const ripCards=[0,1,2].map(i=>{
      const won=phase==="revealed"&&i===WIN;
      return `<div class="ripcard" data-win="${won?'true':'false'}" data-flipped="${won?'true':'false'}">
        <div class="rc-inner">
          <div class="rc-face rc-front hatch"><span class="lbl">Card ${i+1}</span></div>
          <div class="rc-face rc-back hatch"><span class="lbl">Alex Pereira Rookie</span></div>
        </div></div>`;}).join("");
    const colBody=`<p class="txt">Land the Pereira hit to win the leg.</p>
      <div class="ripcards mt16" data-phase="${phase}">${ripCards}</div>`;
    /* Predict settles on its own — the CTA stays dimmed until the result lands. */
    const prePhase=s.prePhase||"awaiting";
    /* Play hand: idle -> playing (3s, dimmed table + progress message) -> won */
    const plyPhase=s.plyPhase||"idle";
    const plyBody=`<p class="txt">Beat the dealer to win the leg.</p>
      <div class="handstage mt16" data-phase="${plyPhase}">
        <div class="hatch r-media"><span class="lbl">${m.title}</span></div>
        <div class="hand-overlay"><span class="hand-msg">Hand in Progress</span></div>
      </div>`;
    const body={
      PRE:`<div class="pcard mt16">
        <div class="pc-info">
          <div class="pc-title">${m.title}</div>
          <div class="pc-odds">${m.sub}</div>
          <span class="badge live">LIVE</span>
        </div>
        <div class="handstage" data-phase="${prePhase==="awaiting"?"playing":"idle"}">
          <div class="pc-img hatch"><span class="lbl">Fight card · Pereira vs. Hill</span></div>
          <div class="hand-overlay"><span class="hand-msg">Fight in Progress</span></div>
        </div>
      </div>`,
      COL:colBody,
      PLY:plyBody
    };
    const cta=this.legCTA(c);
    /* Predict's pcard already carries its own title — the h2 above it would
       just repeat that, so Predict keeps only the room label, no h2. */
    const header=`<span class="detail-roomtag">${roomtag(c)}</span>`
      +(c==="PRE"?"":`\n        <h2 class="h-lg mt12">${m.title}</h2>`);
    return `<div class="main">
      <div class="detail-body">
        ${header}
        ${body[c]}
      </div>
      <div class="detail-foot">${this.legSuccessMsg(c)}${this.ctarow(c,cta)}</div>
    </div>`;
  },
  /* Shared by roomPanel's inline (desktop) CTA and the sticky railfoot's
     mobile CTA, so both always agree on the current leg's button state. */
  legCTA(c){
    const s=S.v1;
    const isLast=s.legs.filter(x=>x!==c).every(x=>s.done[x]);
    const advance=isLast?"Bank the Combo →":"Play Next Leg →";
    let cta={
      PRE:{play:advance},
      COL:{play:"Rip Pack", action:"rip"},
      PLY:{play:"Play Hand", action:"playhand"}
    }[c];
    const prePhase=s.prePhase||"awaiting", colPhase=s.colPhase||"idle", plyPhase=s.plyPhase||"idle";
    if(c==="PRE"&&prePhase==="awaiting") cta={play:"Awaiting Result", disabled:true};
    if(c==="COL"){
      if(colPhase==="ripping") cta={play:"Ripping…", disabled:true};
      else if(colPhase==="revealed") cta={play:advance};
    }
    if(c==="PLY"){
      if(plyPhase==="playing") cta={play:"Dealing…", disabled:true};
      else if(plyPhase==="won") cta={play:advance};
    }
    /* Once every leg's outcome has landed, the CTA banks the combo from
       whichever detail view the user happens to be on — they don't have to
       click through each leg's own "advance" in sequence to finish. */
    if(s.legs.every(x=>this.legMet(x))) cta={play:"Bank the Combo →", action:"bank"};
    return cta;
  },
  legSuccessMsg(c){
    const s=S.v1;
    if(c==="PRE"&&s.prePhase==="won") return `<div class="successmsg"><span class="ok">${IC.check}</span>Pereira Won by TKO!</div>`;
    if(c==="COL"&&s.colPhase==="revealed") return `<div class="successmsg"><span class="ok">${IC.check}</span>You landed the Pereira hit!</div>`;
    if(c==="PLY"&&s.plyPhase==="won") return `<div class="successmsg"><span class="ok">${IC.check}</span>You won the hand!</div>`;
    return "";
  },
  ctarow(c,cta){
    return `<div class="ctarow">
      ${cta.watch?`<button class="btn ghost" data-a="watch" data-c="${c}">${cta.watch}</button>`:""}
      <button class="btn" data-a="${cta.action||'resolve'}" data-c="${c}"${cta.disabled?' disabled':''}>${cta.play}</button>
    </div>`;
  },
  on(a,ds){
    const s=S.v1;
    if(a==="enter"){s.stage=s.placed?"active":"build";}
    else if(a==="stake"){s.stake=Math.max(5,s.stake+ +ds.d);}
    else if(a==="place"){s.placed=true;s.stage="active";}
    else if(a==="gohome"){s.stage="landing";s.active=null;}
    else if(a==="leg"){s.active=ds.c;}
    else if(a==="back"){s.active=null;}
    else if(a==="resolve"){s.done[ds.c]=true;s.active=null;toast(ROOM[ds.c].name+" leg resolved ✓");}
    else if(a==="bank"){s.legs.forEach(c=>s.done[c]=true);s.active=null;}
    else if(a==="watch"){toast("Watch view — not wired in this POC");}
    else if(a==="playhand"){
      s.plyPhase="playing";
      clearTimeout(handT);
      handT=setTimeout(()=>{
        if(S.v!=="v1"||S.v1.plyPhase!=="playing")return;
        S.v1.plyPhase="won"; paint(); toast("You won the hand");
      },3000);
    }
    else if(a==="rip"){
      s.colPhase="ripping";
      clearTimeout(ripT);
      ripT=setTimeout(()=>{
        if(S.v!=="v1"||S.v1.colPhase!=="ripping")return;
        S.v1.colPhase="revealed"; paint(); toast("Pulled: Alex Pereira Rookie");
      },3000);
    }
    else if(a==="rmleg"){ if(s.legs.length>1){ if(s.swapping===ds.c)s.swapping=null; s.legs=s.legs.filter(x=>x!==ds.c); toast(ROOM[ds.c].name+" removed"); } }
    else if(a==="addleg"){ if(!s.legs.includes(ds.c)){ if(ds.mi!==undefined)s.mk[ds.c]=+ds.mi; s.legs=PLAY.order.filter(x=>s.legs.includes(x)||x===ds.c); toast(ROOM[ds.c].name+" added"); } }
    else if(a==="swapleg"){ s.swapping=(s.swapping===ds.c?null:ds.c); }
    else if(a==="useswap"){ s.mk[ds.c]=+ds.mi; s.swapping=null; toast("Swapped the "+ROOM[ds.c].name+" market"); }
  }
};
function IC_arrow(){return '<span class="mono muted" style="font-size:15px">›</span>';}

/* ============================================================ V2 · RUN */
const V2={
  rungs(){
    const s=S.v2;
    // state per rung: done / ready(now) / locked
    const stt=c=>{
      if(c==="PRE")return s.step>=1?"done":"now";
      if(c==="COL")return s.step>=3?"done":s.step>=2?"now":"locked";
      if(c==="PLY")return s.step>=5?"done":s.step>=4?"now":"locked";
    };
    return PLAY.order.map((c,i)=>{
      const st=stt(c);
      return `<div class="leg" data-s="${st==='now'?'ready':st==='done'?'done':'locked'}">
        ${legimg()}
        <div class="body">${roomtag(c)}
        <div class="ttl">${PLAY.legs[c].short}</div>
        <div class="sub">${st==="locked"?"Unlocks from step "+i:st==="done"?"Cleared":"Now"}</div></div>
        <div class="st">${st==="done"?tick("done"):st==="locked"?tick("locked"):tick(i+1)}</div>
      </div>`;
    }).join("");
  },
  timeline(){
    const s=S.v2;
    const stt=c=>{
      if(c==="PRE")return s.step>=1?"done":"now";
      if(c==="COL")return s.step>=3?"done":s.step>=2?"now":"locked";
      if(c==="PLY")return s.step>=5?"done":s.step>=4?"now":"locked";
    };
    const nodes=PLAY.order.map((c,i)=>{const st=stt(c);
      return `<div class="node"><div class="dot ${st==='done'?'on':''} ${st==='now'?'now':''}">${st==='done'?'✓':i+1}</div>
        <div class="cap">${ROOM[c].name}</div></div>`;}).join("");
    return `<div class="timeline">${nodes}</div>`;
  },
  view(){
    const s=S.v2;
    if(s.step>=6||s.step===5)return completeScreen("The run held all the way through.");
    const rail=`<div class="rail">
      <div class="row between"><span class="rtag solid">${IC.cross}BET IT FORWARD</span>
        <span class="badge live">LIVE</span></div>
      <h3 class="h-md mt12">One play, three links</h3>
      <div class="mono muted" style="font-size:11.5px;margin-top:3px">Each link fuels the next</div>
      <div class="stack gap8 mt16">${this.rungs()}</div>
    </div>`;
    return appbar(this.activeRoom())+`<div class="scroll">
      <div style="max-width:1180px;margin:0 auto;padding:16px 20px 0">${this.timeline()}</div>
      <div class="layout">${rail}<div class="main">${this.main()}</div></div></div>`;
  },
  activeRoom(){const s=S.v2;return s.step<=1?"PRE":s.step<=3?"COL":"PLY";},
  main(){
    const s=S.v2;
    if(s.step===0)return `<div class="anim"><div class="row gap8">${rtag("PRE",1)}<span class="badge">Step 1 of 3</span></div>
      <h2 class="h-lg mt12">Call the fight.</h2>
      <p class="txt">Win by KO/TKO and your payout rolls straight into the next play.</p>
      <div class="card flat mt16"><div class="row between"><span>Pereira by KO / TKO · R2</span><span class="mono" style="font-weight:640">+600</span></div>
        <div class="hatch r-media mt12"><span class="lbl">Main event</span></div></div>
      <button class="btn mt20" data-a="next">Lock the call · $${ENTRY}</button></div>`;
    if(s.step===1)return `<div class="anim"><span class="badge solid">Step 1 cleared ✓</span>
      <h2 class="h-lg mt12">Called it. +$${SINGLE}.</h2>
      <p class="txt">Your $${SINGLE} is staged. Roll it into the UFC 299 pack.</p>
      <div class="card mt16"><div class="row between"><span class="mono muted" style="font-size:12px">Winnings staged</span><span class="mono" style="font-weight:640;font-size:18px">$${SINGLE}</span></div>
        <div class="row between mt8" style="font-family:var(--mono);font-size:12px"><span class="muted">→ funds</span><span>UFC 299 Pack</span></div></div>
      <button class="btn mt20" data-a="next">Roll $${SINGLE} into the pack →</button></div>`;
    if(s.step===2)return `<div class="anim"><div class="row gap8">${rtag("COL",1)}<span class="badge">Step 2 of 3</span></div>
      <h2 class="h-lg mt12">Land the pack.</h2>
      <p class="txt">Bought with the call. Whatever you pull becomes your table multiplier.</p>
      <div class="row gap10 mt16">${[0,1,2].map(i=>`<div class="hatch r-card" style="flex:1"><span class="lbl">Card ${i+1}</span></div>`).join("")}</div>
      <button class="btn mt20" data-a="next">Rip the pack →</button></div>`;
    if(s.step===3)return `<div class="anim"><span class="badge solid">Pereira rookie ✓</span>
      <h2 class="h-lg mt12">You pulled the rookie.</h2>
      <p class="txt">Your rookie converts to a ×1.5 table token.</p>
      <div class="card mt16 row gap12"><div class="hatch r-card" style="width:64px"><span class="lbl">RC</span></div>
        <div class="grow"><div style="font-weight:600">Pereira Rookie</div><div class="mono muted" style="font-size:12px">→ ×1.5 table token</div></div></div>
      <button class="btn mt20" data-a="next">Carry token to the table →</button></div>`;
    if(s.step===4)return `<div class="anim"><div class="row gap8">${rtag("PLY",1)}<span class="badge">Step 3 of 3</span></div>
      <h2 class="h-lg mt12">Score it.</h2>
      <p class="txt">Your ×1.5 token is live. Clear a 21 to bank the run.</p>
      <div class="hatch r-media mt16"><span class="lbl">Blackjack · token ×1.5 active</span></div>
      <button class="btn mt20" data-a="next">Play the hand →</button></div>`;
    return "";
  },
  on(a){const s=S.v2; if(a==="next"){s.step++; if(s.step===1)toast("Call hit · +$"+SINGLE); if(s.step===3)toast("Pulled: Pereira rookie"); if(s.step===5)toast("Cross-room bonus unlocked");}}
};

const V={v1:V1,v2:V2};

/* ---------- toast ---------- */
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1700);}

/* ---------- paint ---------- */
function paint(){
  app.innerHTML=V[S.v].view();
  document.querySelectorAll("#varlist button").forEach(b=>b.setAttribute("data-on",b.dataset.v===S.v?"true":"false"));
  syncLegImgs();
  bindScrollHost();
  bindLegCarousel();
  renderMiniTracker();
  scheduleV1Auto();
}
/* Mini tracker — persistent post-bet summary shown on the V1 landing
   screen, floating above the review bar. Desktop: a small always-open
   card, bottom-right. Mobile: a full-width bar above the bar, with its
   own minimize/expand state so it doesn't compete with the framed phone. */
let DEVICE="desktop";
function renderMiniTracker(){
  const el=$("#minitracker"); if(!el) return;
  const s=S.v1;
  const show = S.v==="v1" && s.stage==="landing" && s.placed && s.legs.some(c=>!s.done[c]);
  if(!show){ el.setAttribute("data-show","false"); el.innerHTML=""; return; }
  el.setAttribute("data-show","true");
  el.setAttribute("data-device",DEVICE);
  el.setAttribute("data-open", s.trackerOpen?"true":"false");
  const doneCount=s.legs.filter(c=>s.done[c]).length;
  const legsHtml=s.legs.map(c=>`<div class="mt-leg" data-done="${s.done[c]?'true':'false'}">
      <span class="st">${s.done[c]?IC.check:''}</span><span>${ROOM[c].name}</span></div>`).join("");
  el.innerHTML=`<div class="mt-card">
    <button class="mt-head" data-a="mttoggle">
      <span class="mt-dot"></span>
      <span class="mt-title">The Pereira Run</span>
      <span class="mt-frag">${doneCount}/${s.legs.length}</span>
      <svg class="mt-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="mt-body">
      <div class="mt-legs">${legsHtml}</div>
      <div class="mt-stat"><span>$${s.stake} staked</span><span>·</span><span>$${toWin(s.stake,s.legs)} to win</span></div>
      <button class="mt-cta" data-a="enter">View combo →</button>
    </div>
  </div>`;
  positionMiniTracker();
}
/* On mobile the tracker must dock to the bottom of the phone's own screen
   (the .viewport rect), not the outer app shell — the frame is top-aligned
   in a taller stage, so anchoring to the shell leaves it floating below
   the phone. Desktop just uses the static CSS corner position. */
function positionMiniTracker(){
  const el=$("#minitracker"); if(!el||el.getAttribute("data-show")!=="true") return;
  if(DEVICE!=="mobile"){ el.removeAttribute("style"); return; }
  const r=$("#app").getBoundingClientRect();
  const gap=12, w=Math.min(402,r.width-24);
  el.style.left=(r.left+r.width/2-w/2)+"px";
  el.style.width=w+"px";
  el.style.bottom=(window.innerHeight-r.bottom+gap)+"px";
}
/* Predict resolves on its own clock rather than a tap, so the countdown starts
   as soon as the combo is live. Guarded by preT so re-renders don't restart it. */
function scheduleV1Auto(){
  if(S.v!=="v1")return;
  const s=S.v1;
  if(s.stage!=="active"||s.prePhase!=="awaiting"||s.done.PRE||preT)return;
  preT=setTimeout(()=>{
    preT=null;
    if(S.v!=="v1"||S.v1.prePhase!=="awaiting")return;
    S.v1.prePhase="won"; paint(); toast("Pereira won by TKO");
  },3000);
}
function syncLegImgs(){
  requestAnimationFrame(()=>{
    document.querySelectorAll(".legimg").forEach(el=>{ el.style.width=el.getBoundingClientRect().height+"px"; });
  });
}
/* Mobile leg carousel: land on the selected card after each re-render (it's
   fresh DOM each time, so scroll position doesn't carry over), and keep the
   dots synced to whichever card the user actually swipes to. No-ops on
   desktop, where .legcarousel isn't a horizontal scroller. */
let legIO=null;
function bindLegCarousel(){
  requestAnimationFrame(()=>{
    const car=document.querySelector(".legcarousel");
    if(legIO){legIO.disconnect();legIO=null;}
    if(!car||car.scrollWidth<=car.clientWidth+4)return;
    const sel=car.querySelector('[data-sel="true"]');
    /* instant, not smooth — only the user's own swipe should ever look animated */
    if(sel)sel.scrollIntoView({inline:"center",block:"nearest",behavior:"instant"});
    const dots=document.querySelectorAll(".legdot");
    if(!dots.length)return;
    legIO=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting&&en.intersectionRatio>0.6){
          const c=en.target.dataset.c;
          dots.forEach(d=>d.setAttribute("data-on",d.dataset.c===c?"true":"false"));
        }
      });
    },{root:car,threshold:[0.6]});
    car.querySelectorAll(".leg").forEach(leg=>legIO.observe(leg));
  });
}

/* Sticky header — collapse the masthead once the feed starts scrolling.
   The scroll container differs by device: the phone screen in mobile,
   the stage in desktop. Re-bind whenever either changes. */
let scrollHost=null;
function onFeedScroll(){
  const head=$(".disc-head"); if(!head||!scrollHost) return;
  head.setAttribute("data-condensed", scrollHost.scrollTop>4 ? "true":"false");
}
function bindScrollHost(){
  const dev=$("#frame").getAttribute("data-device");
  const next = dev==="mobile" ? $(".frame[data-device='mobile'] .viewport") : $("#stage");
  if(scrollHost===next){ onFeedScroll(); return; }
  if(scrollHost) scrollHost.removeEventListener("scroll",onFeedScroll);
  scrollHost=next;
  if(scrollHost) scrollHost.addEventListener("scroll",onFeedScroll,{passive:true});
  onFeedScroll();
}

/* Stake +/- only ever changes two numbers on screen — update them in place
   instead of re-rendering, so nothing else reflows or replays its enter animation. */
function updateStakeUI(){
  const s=S.v1;
  const val=$(".stepper.sm .val"); if(val)val.textContent="$"+s.stake;
  const big=$(".stakecol .payline .big"); if(big)big.textContent="$"+toWin(s.stake,s.legs);
  const cta=$('[data-a="place"]'); if(cta)cta.textContent="Place Combo-Play Bet · $"+s.stake;
}

/* ---------- events ---------- */
/* Bound on #xrm (not just #app) so the mini tracker — which floats
   outside the scrolling viewport — shares the same data-a dispatch. */
xrm.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="restart"){reset(S.v);paint();return;}
  if(a==="mttoggle"){S.v1.trackerOpen=!S.v1.trackerOpen; renderMiniTracker(); return;}
  V[S.v].on&&V[S.v].on(a,t.dataset);
  if(a==="stake"&&S.v==="v1"&&S.v1.stage==="build"){ updateStakeUI(); return; }
  paint();
});

/* ---------- review bar ---------- */
const varlist=$("#varlist");
varlist.innerHTML=ORDER.map(v=>{const m=META[v];
  return `<button data-v="${v}" data-on="${v===S.v?'true':'false'}">${m.name}</button>`;}).join("");
varlist.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S.v=b.dataset.v;reset(S.v);paint();});
// Reset learning — restarts the current flow
$("#restart").addEventListener("click",()=>{reset(S.v);paint();});
// Fidelity — Mid-Fi is the source's light theme, Hi-Fi its dark brand theme
document.documentElement.setAttribute("data-skin","");
$("#skinswitch").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.documentElement.setAttribute("data-skin",b.dataset.skin);
  $("#skinswitch").querySelectorAll("button").forEach(x=>x.setAttribute("data-on",x===b?"true":"false"));
  syncLegImgs();
});
// Device — desktop renders full-bleed, mobile renders inside a phone frame
$("#devswitch").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const d=b.dataset.device; DEVICE=d;
  $("#stage").setAttribute("data-device",d);
  $("#frame").setAttribute("data-device",d);
  $("#devswitch").querySelectorAll("button").forEach(x=>x.setAttribute("data-on",x===b?"true":"false"));
  syncLegImgs(); bindScrollHost(); bindLegCarousel(); renderMiniTracker();
});
// collapsed sheet toggle (small windows)
$("#rbtoggle").addEventListener("click",()=>{const d=$("#devtools");
  const open=d.getAttribute("data-open")==="true";
  d.setAttribute("data-open",open?"false":"true");
  $("#rbtoggle").setAttribute("aria-expanded",open?"false":"true");});

let resizeT;
window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{
  document.querySelectorAll(".legimg").forEach(el=>{ el.style.width=el.getBoundingClientRect().height+"px"; });
  positionMiniTracker();
  bindLegCarousel();
},120);});

paint();
})();
</script>
