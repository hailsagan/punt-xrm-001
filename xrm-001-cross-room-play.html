<style>
/* ============================================================= XRM-001
   Cross-room play · 5 UX-pattern variations · grayscale wireframe
   ============================================================= */
:root{
  --bg:#ffffff; --panel:#ffffff; --surface:#f4f4f4; --surface-2:#ececec;
  --ink:#1a1a1a; --ink-2:#535353; --muted:#767676; --faint:#9b9b9b;
  --line:#e4e4e4; --line-2:#d4d4d4; --line-strong:#bcbcbc;
  --fill:#1a1a1a; --on-fill:#ffffff;
  --accent:#1a1a1a; --accent-2:#1a1a1a;
  --hatch:rgba(26,26,26,.06); --ring:rgba(26,26,26,.16);
  --r:10px; --r-sm:7px; --r-lg:14px;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(26,26,26,.04);
  --shadow-lg:0 18px 48px -20px rgba(26,26,26,.26);
}
/* Style skins are set by the in-app switch (bottom-left), not OS/viewer theme.
   Default = light editorial mono. "brand" = dark, higher-VD with lime/vermilion accents. */
:root[data-skin="brand"]{
  --bg:#0d0d0e; --panel:#141416; --surface:#1c1c20; --surface-2:#26262b;
  --ink:#f4f4ef; --ink-2:#b6b6b0; --muted:#9b9b94; --faint:#6f6f68;
  --line:rgba(244,244,239,.10); --line-2:rgba(244,244,239,.16); --line-strong:rgba(244,244,239,.26);
  --fill:#f4f4ef; --on-fill:#141416;
  --accent:#b6fb6f; --accent-2:#ff5a36;
  --hatch:rgba(244,244,239,.08); --ring:rgba(182,251,111,.32);
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 22px 56px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
.xrm{
  font-family:var(--sans); color:var(--ink); background:var(--panel);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.45;
}

/* ---------- app shell (full-viewport, responsive) ---------- */
.appshell{width:100%; min-height:100vh; background:var(--panel)}

/* app top bar (room context) */
.appbar{display:flex; align-items:center; gap:10px; padding:13px 20px;
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; background:var(--panel)}
@media (min-width:760px){ .appbar{padding:15px 32px} }
.appbar .brand{font-weight:800; letter-spacing:-.03em; font-size:17px}
.appbar .brandsub{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--muted); font-weight:500; margin-left:8px}
.appbar .roomswitch{margin-left:auto; display:flex; gap:5px}
.roompill{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; padding:5px 8px;
  border:1px solid var(--line-2); border-radius:7px; color:var(--muted); display:flex; align-items:center; gap:5px}
.roompill.on{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.roompill svg{width:12px; height:12px}

.scroll{display:block}
.pad{padding:22px 20px 96px; max-width:720px; margin:0 auto}
@media (min-width:760px){ .pad{padding:34px 32px 96px} }

/* two-pane on wider viewports */
.layout{display:block; max-width:1180px; margin:0 auto}
.rail{display:block; padding:22px 20px; border-bottom:1px solid var(--line)}
.main{display:block; padding:20px 20px 96px}
@media (min-width:760px){
  .layout{display:grid; grid-template-columns:340px 1fr; gap:0; align-items:stretch}
  .layout .rail{border-right:1px solid var(--line); border-bottom:none; padding:32px 28px; background:var(--surface); min-height:100%}
  .layout .main{padding:32px 40px 96px; min-width:0}
  .layout .rail.plain{background:var(--panel)}
}

/* ---------- primitives ---------- */
.kicker{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:0 0 8px}
.h-lg{font-size:28px; font-weight:700; letter-spacing:-.022em; line-height:1.11; margin:0; text-wrap:balance}
.h-md{font-size:16.5px; font-weight:650; letter-spacing:-.012em; margin:0}
.txt{font-size:13.5px; color:var(--ink-2); margin:8px 0 0; max-width:60ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.divider{height:1px; background:var(--line); margin:16px 0; border:0}
.stack{display:flex; flex-direction:column}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.gap16{gap:16px}
.row{display:flex; align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto; min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}

/* buttons */
.btn{font-family:var(--sans); font-size:14px; font-weight:600; border-radius:9px;
  padding:13px 16px; border:1px solid var(--accent); background:var(--accent); color:var(--on-fill);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; transition:transform .12s, opacity .12s, background .15s; text-align:center}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface); opacity:1}
.btn.sm{padding:9px 13px; font-size:12.5px; width:auto; border-radius:9px}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn .m{font-family:var(--mono); font-size:12px; opacity:.75}
.btnrow{display:flex; gap:10px}
button:focus-visible,[tabindex]:focus-visible,.tap:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:8px}

/* card */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:16px}
.card.flat{box-shadow:none; background:var(--surface)}
.card.sel{border-color:var(--fill); box-shadow:0 0 0 1px var(--fill)}

/* ===== discovery landing — replicates Punt Predict discovery (PRE-002) ===== */
.disc{max-width:1163px; margin:0 auto}
/* utility row */
.disc-utility{display:flex; align-items:center; gap:16px; padding:8px 16px; border-bottom:1px solid var(--line)}
.disc-pmark{font-family:var(--sans); font-weight:800; font-size:17px; letter-spacing:-.03em; color:var(--ink);
  background:none; border:0; padding:0; cursor:pointer; flex:0 0 auto}
.disc-search{display:flex; align-items:center; gap:7px; width:256px; padding:0 0 2px; color:var(--muted); flex:0 0 auto}
.disc-search svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; flex:0 0 auto}
.disc-search span{font-size:13px}
.disc-editions{display:flex; gap:20px; margin:0 auto}
.disc-edition{font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); background:none; border:0; padding:0; cursor:pointer}
.disc-edition[data-on="true"]{color:var(--ink)}
.disc-account{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.disc-wallet{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
  border-radius:999px; padding:3px 12px; font-size:12px; color:var(--ink); background:none; cursor:pointer}
.disc-wallet svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8}
.disc-avatar{width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
  display:grid; place-items:center; background:none; cursor:pointer; color:var(--ink-2)}
.disc-avatar svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8}
/* masthead */
.disc-flag{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:16px 16px 20px}
.disc-dateline time{display:block; font-size:12px; color:var(--ink)}
.disc-dateline .sub{display:block; font-size:12px; color:var(--muted); text-decoration:underline; margin-top:2px}
.disc-logo{font-family:var(--sans); font-weight:800; font-size:30px; letter-spacing:.06em; color:var(--ink); text-align:center}
.disc-quote{justify-self:end; display:flex; align-items:baseline; gap:7px; font-size:12px}
.disc-quote .l{color:var(--muted)}
.disc-quote .v{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.disc-quote .m{color:var(--muted); font-variant-numeric:tabular-nums}
/* category tabs */
.disc-tabs{display:flex; gap:22px; padding:0 16px; border-bottom:3px double rgba(26,26,26,.28); overflow-x:auto}
.disc-tab{font-size:13px; font-weight:700; color:var(--muted); background:none; border:0;
  padding:12px 0; cursor:pointer; white-space:nowrap; position:relative}
.disc-tab[data-on="true"]{color:var(--ink)}
.disc-tab[data-on="true"]::after{content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--ink)}
/* band header */
.disc-band{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:18px 16px 10px}
.disc-bandtitle{font-size:22px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0;
  display:flex; align-items:center; gap:8px}
.disc-bandtitle svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8}
.disc-bandnote{font-size:13px; color:var(--muted)}
/* trending: hero + tuner */
.disc-top{display:grid; grid-template-columns:1fr; gap:4px; padding:0 16px}
@media (min-width:900px){ .disc-top{grid-template-columns:1fr 330px} }
/* tuner panel */
.tuner{background:var(--panel); border:1px solid var(--line); padding:16px}
.tuner-head{display:flex; gap:9px; align-items:flex-start; margin-bottom:14px}
.tuner-head svg{width:16px; height:16px; stroke:var(--ink); fill:none; stroke-width:1.8; margin-top:2px; flex:0 0 auto}
.tuner-title{font-size:16px; font-weight:600; color:var(--ink); margin:0}
.tuner-sub{font-size:13px; color:var(--muted); margin:2px 0 0}
.tuner-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tuner-tile{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 10px; text-align:left}
.tuner-tile .num{display:block; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.tuner-tile .nm{display:block; font-size:13px; font-weight:600; color:var(--ink); text-transform:uppercase; letter-spacing:.04em; margin-top:2px}
.tuner-tile .eg{display:block; font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tuner-check{width:16px; height:16px; border-radius:3px; border:1px solid var(--line-strong);
  background:var(--fill); display:grid; place-items:center; flex:0 0 auto; margin-top:2px}
.tuner-check svg{width:11px; height:11px; stroke:var(--on-fill); fill:none; stroke-width:2.6}
/* shelf of standard cards */
.disc-shelf{display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:0 16px 24px}
@media (min-width:900px){ .disc-shelf{grid-template-columns:repeat(4,1fr)} }
.dcard{border:1px solid var(--line); background:var(--panel); overflow:hidden; display:flex; flex-direction:column; text-align:left}
.dcard-img{position:relative; height:132px; background:#25272b; overflow:hidden}
.dcard-img .sc{position:absolute; inset:0;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 1px, transparent 1px 8px),
    linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.15) 60%)}
.dcard-img .tag{position:absolute; left:10px; bottom:10px; z-index:2}
.dcard-body{padding:12px 16px 16px}
.dcard-q{font-size:18px; font-weight:600; color:var(--ink); line-height:1.3; margin:0}
.dcard-meta{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin:8px 0 0}
.dcard-outs{display:flex; flex-direction:column; gap:9px; margin-top:12px}
.dout-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.dout-name{font-size:13px; font-weight:600; color:var(--ink)}
.dout-vals{display:flex; gap:9px; align-items:baseline; font-variant-numeric:tabular-nums}
.dout-mult{font-size:12px; color:var(--muted)}
.dout-pct{font-size:13px; font-weight:700; color:var(--ink)}
.dout-track{height:3px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:5px}
.dout-fill{height:100%; background:var(--line-strong)}
/* discovery — small screens */
@media (max-width:760px){
  .disc-search{display:none}
  .disc-editions{margin:0 0 0 auto; gap:14px}
  .disc-wallet span,.disc-wallet{font-size:11px}
  .disc-flag{grid-template-columns:1fr; justify-items:center; gap:10px; text-align:center; padding:14px 16px 16px}
  .disc-quote{justify-self:center}
  .disc-logo{font-size:26px}
  .tuner-grid{grid-template-columns:1fr}
}

/* hero / landing feature card — styled after Punt Predict discovery (PRE-002) */
.hero{position:relative; border-radius:0; overflow:hidden; min-height:400px;
  display:flex; flex-direction:column; justify-content:space-between; padding:20px;
  color:#fff; cursor:pointer; border:0; text-align:left; width:100%; background:#25272b}
.hero .heroscrim{position:absolute; inset:0; z-index:1;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 1px, transparent 1px 8px),
    linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.2) 55%, rgba(0,0,0,.4) 100%)}
.hero>*:not(.heroscrim){position:relative; z-index:2}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start}
.hero-badge{display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.42);
  color:#fff; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; padding:6px 11px; border-radius:999px}
.hero-badge .dot{width:6px; height:6px; border-radius:50%; background:#8a8f99; flex:0 0 auto}
.hero-badge.live .dot{background:#ff5a36}
.hero-h{font-family:var(--sans); font-size:28px; font-weight:600; letter-spacing:-.02em;
  line-height:1.18; margin:0; text-wrap:balance}
.hero-meta{font-family:var(--sans); font-size:12px; color:rgba(255,255,255,.82); margin:6px 0 0}
.hero-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  font-family:var(--sans); font-size:13px; font-weight:600}
.hero-row .vals{display:flex; gap:10px; align-items:baseline; font-variant-numeric:tabular-nums}
.hero-row .mult{font-weight:400; opacity:.7; font-size:12px}
.hero-track{height:4px; border-radius:2px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:7px}
.hero-fill{height:100%; background:#fff}
.hero-bottom{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.hero-bottom .hero-txt{flex:1 1 200px; min-width:0; text-align:left}
.hero-cta{flex:0 0 auto; background:transparent; color:#fff;
  border:1px solid rgba(255,255,255,.6); border-radius:8px; padding:9px 18px;
  font-family:var(--sans); font-size:13px; font-weight:600; transition:.14s}
.hero:hover .hero-cta{background:rgba(255,255,255,.12)}

/* room tag + icon */
.rtag{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border:1px solid var(--line-2); border-radius:6px; color:var(--ink-2); display:inline-flex;
  align-items:center; gap:5px; white-space:nowrap; background:var(--panel)}
.rtag svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.7}
.rtag.solid{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.ricon{width:26px; height:26px; border-radius:8px; border:1px solid var(--line-2); display:grid;
  place-items:center; flex:0 0 auto; background:var(--panel)}
.ricon svg{width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.7}
.ricon.solid{background:var(--fill); border-color:var(--fill)}
.ricon.solid svg{stroke:var(--on-fill)}

/* leg-card image placeholder: square, left-aligned, 8px inset from card edges */
.legimg{flex:0 0 auto; align-self:stretch; margin:-6px 0 -6px -6px; border-radius:var(--r-sm)}

/* hatch placeholder */
.hatch{background-image:repeating-linear-gradient(45deg,var(--hatch) 0 1px,transparent 1px 7px);
  border:1px solid var(--line); border-radius:var(--r-sm); position:relative}
.hatch .lbl{position:absolute; inset:auto 8px 8px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.08em; color:var(--muted); text-transform:uppercase}
.portrait{width:100%; aspect-ratio:1/1; border-radius:var(--r-sm)}
.hatch.r-media{aspect-ratio:16/9; width:100%; max-height:240px}
.hatch.r-card{aspect-ratio:5/7}

/* leg row (persistent play) */
.leg{display:flex; gap:12px; align-items:center; padding:13px; border-radius:11px; color:var(--ink);
  border:1px solid var(--line); background:var(--panel); position:relative; transition:.18s}
.leg .body{min-width:0; flex:1 1 auto}
.leg .ttl{font-size:13.5px; font-weight:560; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.leg .sub{font-size:11.5px; color:var(--muted); margin-top:1px; font-family:var(--mono)}
.leg .st{flex:0 0 auto}
.leg[data-s="locked"]{border-style:dashed; opacity:.6}
.leg[data-s="ready"]{border-color:var(--line-strong)}
.leg[data-s="ready"]::before{content:""; position:absolute; inset:-1px; border-radius:12px;
  box-shadow:0 0 0 2px var(--ring); animation:pulse 2s infinite; pointer-events:none}
.leg[data-s="done"]{background:var(--surface)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.tick{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center}
.tick svg{width:12px; height:12px; stroke:var(--on-fill); fill:none; stroke-width:2.4}
.tick.done{background:var(--accent); border-color:var(--accent)}
.tick.lock svg{stroke:var(--muted); stroke-width:1.7}
.stepnum{font-family:var(--mono); font-size:11px; color:var(--muted); width:22px; height:22px;
  border:1px solid var(--line-2); border-radius:50%; display:grid; place-items:center}

/* multiplier meter */
.meter{display:flex; gap:4px; align-items:stretch; height:9px; margin-top:6px}
.meter i{flex:1; background:var(--surface-2); border-radius:3px; overflow:hidden; position:relative}
.meter i.on{background:var(--fill)}
.meter i.bonus{flex:.7; background:transparent; border:1px dashed var(--line-strong)}
.meter i.bonus.on{background:var(--accent); border-color:var(--accent); border-style:solid}

/* stat / payout */
.payline{display:flex; align-items:baseline; gap:10px; font-family:var(--mono); font-variant-numeric:tabular-nums}
.payline .big{font-family:var(--sans); font-size:44px; font-weight:700; letter-spacing:-.03em; color:var(--accent); line-height:1}
.payline .was{font-size:14px; color:var(--muted); text-decoration:line-through}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.stat{border:1px solid var(--line); border-radius:11px; padding:12px}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:var(--mono); font-size:19px; font-weight:640; margin-top:5px; font-variant-numeric:tabular-nums}
.stat.hero{background:var(--accent); border-color:var(--accent)}
.stat.hero .k{color:var(--on-fill); opacity:.62}
.stat.hero .v{color:var(--on-fill)}

/* stake stepper */
.stepper{display:flex; align-items:center; border:1px solid var(--line-2); border-radius:11px; overflow:hidden}
.stepper button{width:44px; height:44px; border:0; background:var(--panel); color:var(--ink);
  font-size:19px; cursor:pointer; font-family:var(--mono)}
.stepper button:hover{background:var(--surface)}
.stepper .val{flex:1; text-align:center; font-family:var(--mono); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums}
.stepper.sm{width:100%}
.stepper.sm button{width:34px; height:34px; font-size:16px; flex:0 0 auto}
.stepper.sm .val{flex:1; font-size:15px; padding:0 6px}
.stakesplit{display:flex; align-items:stretch; gap:20px}
.stakecol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center}
.stakediv{width:1px; background:var(--line); flex:0 0 auto}

/* pill / badge */
.badge{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 8px; border-radius:100px; border:1px solid var(--line-2); color:var(--ink-2)}
.badge.solid{background:var(--accent); color:var(--on-fill); border-color:var(--accent)}
.badge.live{border-color:var(--ink); color:var(--ink); display:inline-flex; gap:6px; align-items:center}
.badge.live::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent-2); animation:pulse 1.4s infinite}
.countdown{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-2)}

/* why-note (inline product transparency) */
.why{border:1px solid var(--line); border-left:2px solid var(--ink); border-radius:9px;
  padding:11px 13px; background:var(--surface); font-size:12px; color:var(--ink-2); margin-top:14px}
.why b{color:var(--ink); font-weight:600}

/* enter animation */
.anim{animation:enter .34s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}

/* timeline (V3) */
.timeline{display:flex; align-items:center; gap:0; margin:14px 0 4px}
.timeline .node{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative}
.timeline .node::after{content:""; position:absolute; top:11px; left:50%; width:100%; height:1.5px; background:var(--line-2); z-index:0}
.timeline .node:last-child::after{display:none}
.timeline .dot{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line-2);
  background:var(--panel); z-index:1; display:grid; place-items:center; font-family:var(--mono); font-size:9px}
.timeline .dot.on{background:var(--fill); border-color:var(--fill); color:var(--on-fill)}
.timeline .dot.now{border-color:var(--ink); box-shadow:0 0 0 3px var(--ring)}
.timeline .cap{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:var(--muted)}

/* station card (V3) */
.station{border:1px solid var(--line); border-radius:var(--r); padding:15px; background:var(--panel); position:relative}
.station.up{border-color:var(--ink); box-shadow:var(--shadow)}
.station.dim{opacity:.55}

/* V3 interstitial — confirms the step you just took, auto-dismisses */
.interstitial{margin-top:16px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  padding:18px 18px 20px; position:relative; overflow:hidden; cursor:pointer}
.interstitial .ib-top{display:flex; align-items:center; gap:10px}
.ib-badge{width:30px; height:30px; border-radius:50%; background:var(--accent); display:grid; place-items:center; flex:0 0 auto}
.ib-badge svg{width:15px; height:15px; stroke:var(--on-fill); fill:none; stroke-width:2.6}
.ib-delta{display:flex; align-items:baseline; gap:8px; margin-top:15px; font-family:var(--mono); font-variant-numeric:tabular-nums}
.ib-delta .d{font-size:22px; font-weight:700; color:var(--accent); letter-spacing:-.01em}
.ib-delta .t{font-size:12px; color:var(--muted)}
.ib-next{display:flex; align-items:center; gap:9px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2)}
.ib-next svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; flex:0 0 auto}
.ib-hint{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:14px}
.ib-prog{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--surface-2)}
.ib-prog i{display:block; height:100%; background:var(--accent); transform-origin:left; animation:ibprog 2.8s linear forwards}
@keyframes ibprog{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* puck (V5) */
.roomstage{position:relative; min-height:calc(100vh - 62px); display:flex; flex-direction:column}
.roombg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:40px; text-align:center; color:var(--muted)}
.roombg .big-icon{width:66px; height:66px; border:1px dashed var(--line-2); border-radius:18px; display:grid; place-items:center}
.roombg .big-icon svg{width:32px; height:32px; stroke:var(--faint); fill:none; stroke-width:1.4}
.puck{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; width:min(460px,calc(100vw - 32px));
  background:var(--panel); border:1px solid var(--line-strong); border-radius:18px; box-shadow:var(--shadow-lg);
  padding:15px 16px; cursor:pointer; transition:transform .2s; z-index:40}
.puck:hover{transform:translateX(-50%) translateY(-2px)}
.puck.sheet{cursor:default}
.sheetgrip{width:34px; height:4px; border-radius:3px; background:var(--line-2); margin:-4px auto 12px}
.puck-legs{display:flex; gap:6px; margin-top:10px}
.puck-legs i{flex:1; height:5px; border-radius:3px; background:var(--surface-2)}
.puck-legs i.on{background:var(--fill)}
.puck-legs i.now{background:var(--fill); animation:pulse 1.6s infinite}

/* conviction ring (V4) */
.convo{display:flex; align-items:center; gap:14px}
.ring{width:74px; height:74px; flex:0 0 auto; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-weight:680; font-size:15px}
.ways{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.way{display:flex; gap:11px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:11px}
.way[data-s="locked"]{border-style:dashed; opacity:.55}
.way[data-s="done"]{background:var(--surface)}

/* toast */
.toast{position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px);
  background:var(--fill); color:var(--on-fill); font-size:12.5px; font-weight:500;
  padding:10px 16px; border-radius:100px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:.25s; z-index:60; font-family:var(--mono); letter-spacing:.02em; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%)}

/* UX notes — tray anchored above the review bar */
.dt-notes-tray{position:fixed; right:20px; bottom:104px; width:326px;
  background:var(--surface); border:1px solid var(--line-2); border-radius:16px;
  padding:16px; box-shadow:var(--shadow-lg); max-height:min(60vh,520px); overflow-y:auto;
  opacity:0; transform:translateY(10px); pointer-events:none; z-index:1001;
  transition:opacity .2s ease, transform .24s cubic-bezier(.2,.7,.2,1)}
.devtools[data-notes="on"] .dt-notes-tray{opacity:1; transform:translateY(0); pointer-events:auto}
.tray-title{font-family:var(--mono); font-size:11px; letter-spacing:.05em; font-weight:600; color:var(--ink)}
.tray-pattern{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.tray-sec{margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.tray-sec .tag{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.tray-sec p{margin:0; font-size:12px; line-height:1.46; color:var(--ink-2)}
@media (max-width:760px){
  .dt-notes-tray{left:12px; right:12px; width:auto; bottom:132px; max-height:44vh}
}

/* ---------- review bar (full-width, fixed bottom — style borrowed from PRE-002 review harness) ---------- */
.devtools{position:fixed; left:0; right:0; bottom:0; z-index:1000; font-family:var(--sans);
  background:#16171a; border-top:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:22px; padding:12px 20px; overflow-x:auto}
.rb-brand{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:#6b6f78; flex:0 0 auto; white-space:nowrap}
.rb-group{display:flex; flex-direction:column; gap:5px; flex:0 0 auto}
.rb-grouplabel{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:#7d818b}
.rb-seg{display:flex; gap:2px; background:rgba(255,255,255,.05); border-radius:8px; padding:2px}
.rb-seg button{border:0; background:transparent; color:#b7bac1; font-family:var(--sans);
  font-size:12px; font-weight:500; padding:6px 11px; border-radius:6px; cursor:pointer;
  display:flex; align-items:center; gap:5px; white-space:nowrap; transition:.14s}
.rb-seg button[data-on="true"]{background:#2f3238; color:#fff}
.rb-seg button:hover:not([data-on="true"]){color:#dfe1e5}
.rb-actions{display:flex; align-items:center; gap:14px; margin-left:auto; flex:0 0 auto}
.rb-action{display:inline-flex; align-items:center; gap:6px; border:0; background:transparent;
  color:#b7bac1; font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer; padding:6px 2px; transition:.14s}
.rb-action:hover{color:#fff}
.rb-action.on{color:#fff}
.rb-action svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2}
/* V1 combo builder — leg controls + suggestions */
.legctl{display:flex; gap:5px; flex:0 0 auto}
.icbtn{width:27px; height:27px; border:1px solid var(--line-2); border-radius:7px; background:var(--panel);
  color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.14s; padding:0}
.icbtn:hover{border-color:var(--line-strong); color:var(--ink); background:var(--surface)}
.icbtn:disabled{opacity:.32; cursor:not-allowed}
.icbtn svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8}
.icbtn.active{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.leg.swapping{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink)}
.suggest{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line-strong)}
.suggest-h{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.suggrid{display:flex; gap:10px; margin-top:10px; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:-4px}
.suggrid::-webkit-scrollbar{height:5px}
.suggrid::-webkit-scrollbar-track{background:transparent}
.suggrid::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:3px}
.sug{display:flex; align-items:center; gap:12px; flex:0 0 258px; min-width:0; scroll-snap-align:start; text-align:left; cursor:pointer; color:var(--ink);
  background:var(--panel); border:1px dashed var(--line-2); border-radius:11px; padding:13px; transition:.14s}
.sug:hover{border-style:solid; border-color:var(--line-strong); background:var(--surface)}
.sug-b{flex:1 1 auto; min-width:0}
.sug-t{display:block; font-size:13px; font-weight:560; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sug-s{display:block; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:1px}
.sug-add{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; font-weight:600;
  border:1px solid var(--line-2); border-radius:100px; padding:4px 10px; color:var(--ink-2); margin-top:8px; transition:.14s}
.sug:hover .sug-add{background:var(--fill); color:var(--on-fill); border-color:var(--fill)}
.sug-add.swap svg{width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2}
.hint-cap{font-size:10.5px; color:var(--muted); margin-top:10px; padding-left:2px}
.reduced *{animation:none !important}
</style>

<div class="xrm" id="xrm" data-notes="off">
  <div class="appshell" id="stage">
    <div id="app"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="devtools" id="devtools" data-notes="off">
  <span class="rb-brand">XRM-001 · review</span>

  <div class="rb-group" role="group" aria-label="Concept">
    <span class="rb-grouplabel">Concept</span>
    <div class="rb-seg" id="varlist"></div>
  </div>

  <div class="rb-group" role="group" aria-label="Skin">
    <span class="rb-grouplabel">Skin</span>
    <div class="rb-seg" id="skinswitch">
      <button data-skin="" data-on="true">Light</button>
      <button data-skin="brand">Dark</button>
    </div>
  </div>

  <div class="rb-actions">
    <button class="rb-action" id="notesbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v13H8l-4 4V4z"/></svg>
      UX notes
    </button>
    <button class="rb-action" id="restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Restart
    </button>
  </div>

  <div class="dt-notes-tray" id="notesband"></div>
</div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app"), stage=$("#stage"), xrm=$("#xrm");
if(matchMedia("(prefers-reduced-motion:reduce)").matches) xrm.classList.add("reduced");

/* ---------- icons ---------- */
const IC={
  PRE:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2"/><path d="M12 1.5V5M12 19v3.5M1.5 12H5M19 12h3.5"/></svg>',
  PLY:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>',
  COL:'<svg viewBox="0 0 24 24"><rect x="6.5" y="4" width="13" height="17" rx="2.2"/><path d="M4.2 7.2 3 8a2 2 0 0 0-.6 2.5l3.4 9.2"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg>',
  swap:'<svg viewBox="0 0 24 24"><path d="M16 4l3 3-3 3M19 7H8M8 20l-3-3 3-3M5 17h11"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const ROOM={PRE:{name:"Predict",verb:"Call it"},COL:{name:"Collect",verb:"Land it"},PLY:{name:"Play",verb:"Score it"}};
function ricon(code,solid){return `<span class="ricon ${solid?'solid':''}">${IC[code]}</span>`}
function legimg(){return `<div class="legimg hatch"></div>`}
function rtag(code,solid){return `<span class="rtag ${solid?'solid':''}">${IC[code]}${ROOM[code].name}</span>`}
function roomtag(code){return `<span class="rtag">${ROOM[code].name}</span>`}

/* ---------- shared play data ---------- */
const PLAY={
  event:"UFC 299 · Main Card", when:"Tonight · 10:00 PM",
  entity:"Alex Pereira",
  legs:{
    PRE:{verb:"Call it",title:"Pereira by KO / TKO",sub:"Round 2 · +600",short:"Call the fight",room:"PRE"},
    COL:{verb:"Land it",title:"UFC 299 Pack",sub:"Land the Pereira rookie",short:"Rip the pack",room:"COL"},
    PLY:{verb:"Score it",title:"Fight-Night Blackjack",sub:"Clear a 21 to bank the run",short:"Run the table",room:"PLY"}
  },
  order:["PRE","COL","PLY"]
};
const ENTRY=20, SINGLE=140, CROSS=434; // payout story: single-room vs full cross-room
const MARKETS={
  PRE:[{title:"Pereira by KO / TKO",sub:"Round 2 · +600",odds:"+600",mult:7.0},
       {title:"Pereira to win",sub:"Moneyline · +140",odds:"+140",mult:2.4}],
  COL:[{title:"UFC 299 Pack",sub:"Land the Pereira rookie",odds:"×1.8",mult:1.8},
       {title:"Champions Pack",sub:"Shot at a title-holder auto",odds:"×2.2",mult:2.2}],
  PLY:[{title:"Fight-Night Blackjack",sub:"Clear a 21 to bank the run",odds:"×1.5",mult:1.5},
       {title:"Fight-Night Baccarat",sub:"Back the player hand",odds:"×1.4",mult:1.4}]
};

/* ---------- variation meta ---------- */
const META={
  v1:{code:"V1",name:"The Combo Slip",pattern:"Bundle Parlay up-front",
      note:"All three legs committed up front as one ticket, one stake, one multiplier — then you visit each room to resolve the leg you already own.",
      move:"Movement = resolving your own pre-committed bet, never a new decision to 'go somewhere else'.",
      risk:"Legs can feel simultaneous rather than causal; the room visit must add play, not just confirm."},
  v2:{code:"V2",name:"The Run",pattern:"Roll each win into the next",
      note:"Each room's result fuels the next. The call funds the pack; the pull becomes a table token. Leg 2 stays locked until leg 1 lands.",
      move:"Movement is the only way forward and every move is powered by the last — unmistakably one continuous play.",
      risk:"Gating can read as a forced funnel if a losing leg dead-ends the run; needs a graceful fail path."}
};
const ORDER=["v1","v2"];

/* ---------- state ---------- */
const S={v:"v1",notes:false,
  v1:{stage:"landing",stake:ENTRY,active:null,done:{PRE:false,COL:false,PLY:false},placed:false,legs:["PRE","COL","PLY"],mk:{PRE:0,COL:0,PLY:0},swapping:null},
  v2:{step:0}, // 0 pre, 1 pre-hit, 2 col, 3 col-hit, 4 ply, 5 done
};
function reset(v){
  if(v==="v1")S.v1={stage:"landing",stake:ENTRY,active:null,done:{PRE:false,COL:false,PLY:false},placed:false,legs:["PRE","COL","PLY"],mk:{PRE:0,COL:0,PLY:0},swapping:null};
  if(v==="v2")S.v2={step:0};
}

/* ---------- V1 combo helpers ---------- */
function mkt(c){return MARKETS[c][(S.v1.mk&&S.v1.mk[c])||0];}
function comboMult(legs){return legs.reduce((m,c)=>m*mkt(c).mult,1);}
function toWin(stake,legs){return Math.round(stake*comboMult(legs)*(legs.length>=3?1.15:1));}

/* ---------- shared components ---------- */
function meter(count,bonus){
  return `<div class="meter">
    <i class="${count>=1?'on':''}"></i><i class="${count>=2?'on':''}"></i><i class="${count>=3?'on':''}"></i>
    <i class="bonus ${bonus?'on':''}"></i></div>`;
}
function tick(state){
  if(state==="done")return `<span class="tick done">${IC.check}</span>`;
  if(state==="locked")return `<span class="tick lock">${IC.lock}</span>`;
  return `<span class="stepnum">${state}</span>`;
}
function legRow(code,state,idx){
  const l=PLAY.legs[code];
  const st=state==="done"?"done":state==="locked"?"locked":"ready";
  const mark=state==="done"?tick("done"):state==="locked"?tick("locked"):tick(idx);
  return `<div class="leg" data-s="${st}">
    ${legimg()}
    <div class="body">
      ${roomtag(code)}
      <div class="ttl">${l.title}</div>
      <div class="sub">${l.sub}</div>
    </div>
    <div class="st">${mark}</div>
  </div>`;
}
function payoutBlock(){
  return `<div class="statgrid">
    <div class="stat"><div class="k">Base</div><div class="v">$${SINGLE}</div></div>
    <div class="stat hero"><div class="k">Cross-room bonus</div><div class="v">+15%</div></div>
  </div>`;
}
function completeScreen(headline,legs){
  legs=legs||PLAY.order;
  return `<div class="pad anim">
    <div class="row between"><span class="kicker">Play complete</span><span class="badge solid">XRM ✓</span></div>
    <h2 class="h-lg mt8">${headline}</h2>
    ${meter(legs.length,legs.length>=3)}
    <div class="row gap8 mt16 wrap">${legs.map(c=>rtag(c,1)).join("")}
      <span class="badge">${legs.length} / ${legs.length} rooms</span></div>
    <div class="mt20 payline"><span class="big">$${CROSS}</span><span class="was">$${SINGLE}</span>
      <span class="badge">banked</span></div>
    ${payoutBlock()}
    <button class="btn mt20" data-a="restart">Run another cross-room play</button>
    <button class="btn ghost mt8" data-a="restart">Back to start</button>
  </div>`;
}
function appbar(active){
  return `<div class="appbar"><span class="brand">Punt</span></div>`;
}

/* ============================================================ V1 · SLIP */
const V1={
  view(){
    const s=S.v1;
    if(s.stage==="landing")return this.landing();
    if(s.stage==="build")return this.build();
    return this.active();
  },
  landing(){
    const tabs=["Featured","Politics","Economics","Sports","Crypto","Tech","Culture","Climate"]
      .map((t,i)=>`<button class="disc-tab" data-on="${i===0}">${t}</button>`).join("");
    const topics=[["01","Politics","Elections / Congress"],["02","Economics","Fed / CPI / S&P"],
      ["03","Sports","MLB / NFL / Tennis"],["04","Crypto","BTC / ETH / SOL"],
      ["05","Tech","AI / Apple / Tesla"],["06","Culture","Movies / Music"],["07","Climate","Storms / Heat"]]
      .map(([n,nm,eg])=>`<div class="tuner-tile"><span><span class="num">(${n})</span>
        <span class="nm">${nm}</span><span class="eg">${eg}</span></span>
        <span class="tuner-check">${IC.check}</span></div>`).join("");
    const shelf=[
      {cat:"Economics",q:"Will the Fed raise rates at its July 2026 meeting?",vol:"$16.2M vol",mk:"2 markets",y:36,ym:"2.78×",n:64,nm:"1.56×"},
      {cat:"Culture",q:"Will “The Odyssey” gross over $500M worldwide by Labor Day?",vol:"$1.8M vol",mk:"1 market",y:58,ym:"1.72×",n:42,nm:"2.38×"},
      {cat:"Crypto",q:"Will Bitcoin hit a new all-time high in August 2026?",vol:"$6.7M vol",mk:"2 markets",y:44,ym:"2.27×",n:56,nm:"1.79×"},
      {cat:"Politics",q:"Will the US government shut down before October 2026?",vol:"$5.6M vol",mk:"3 markets",y:31,ym:"3.23×",n:69,nm:"1.45×"}
    ].map(c=>`<div class="dcard">
      <div class="dcard-img"><span class="sc"></span>
        <span class="tag"><span class="hero-badge live"><span class="dot"></span>${c.cat} · Live</span></span></div>
      <div class="dcard-body">
        <p class="dcard-q">${c.q}</p>
        <p class="dcard-meta"><span>${c.vol}</span><span>·</span><span>${c.mk}</span></p>
        <div class="dcard-outs">
          <div><div class="dout-head"><span class="dout-name">Yes</span>
            <span class="dout-vals"><span class="dout-mult">${c.ym}</span><span class="dout-pct">${c.y}%</span></span></div>
            <div class="dout-track"><div class="dout-fill" style="width:${c.y}%"></div></div></div>
          <div><div class="dout-head"><span class="dout-name">No</span>
            <span class="dout-vals"><span class="dout-mult">${c.nm}</span><span class="dout-pct">${c.n}%</span></span></div>
            <div class="dout-track"><div class="dout-fill" style="width:${c.n}%"></div></div></div>
        </div>
      </div></div>`).join("");
    return `<div class="scroll anim"><div class="disc">
      <div class="disc-utility">
        <button class="disc-pmark">P</button>
        <span class="disc-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search markets</span></span>
        <nav class="disc-editions">
          <button class="disc-edition" data-on="true">Predict</button>
          <button class="disc-edition">Play</button>
          <button class="disc-edition">Collect</button>
        </nav>
        <div class="disc-account">
          <button class="disc-wallet"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M16 12.5h2.5"/></svg>$250.00</button>
          <button class="disc-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/></svg></button>
        </div>
      </div>
      <div class="disc-flag">
        <div class="disc-dateline"><time>Monday, July 27, 2026</time><span class="sub">Today’s Board</span></div>
        <div class="disc-logo">PUNT</div>
        <div class="disc-quote"><span class="l">Volume</span><span class="v">$164.7M</span><span class="m">+2.18¢ ↑</span></div>
      </div>
      <nav class="disc-tabs">${tabs}</nav>
      <header class="disc-band">
        <h2 class="disc-bandtitle"><svg viewBox="0 0 24 24"><path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.7-3 1.5-4.2.3 1.2 1 2 1.9 2.2C10 8 12 6 12 3z"/></svg>Trending now</h2>
        <span class="disc-bandnote">Biggest movers · last hour</span>
      </header>
      <div class="disc-top">
        <button class="hero" data-a="enter">
          <span class="heroscrim"></span>
          <div class="hero-top"><span class="hero-badge live"><span class="dot"></span>UFC 299 · Live</span></div>
          <div class="hero-bottom">
            <div class="hero-txt">
              <h2 class="hero-h">The Pereira Run</h2>
              <p class="hero-meta">$434 to win · one ticket across 3 rooms</p>
            </div>
            <span class="hero-cta">Build Combo</span>
          </div>
        </button>
        <aside class="tuner">
          <div class="tuner-head">
            <svg viewBox="0 0 24 24"><path d="M10 5H3M12 19H3M14 3v4M16 17v4M21 12h-9M21 19h-5M21 5h-7M8 10v4M8 12H3"/></svg>
            <div><p class="tuner-title">Customize your view</p>
              <p class="tuner-sub">7 of 7 topics showing · tap to refine</p></div>
          </div>
          <div class="tuner-grid">${topics}</div>
        </aside>
      </div>
      <div class="disc-shelf">${shelf}</div>
    </div></div>`;
  },
  build(){
    const s=S.v1;
    const legs=s.legs.map((c)=>{
      const m=mkt(c), swapping=s.swapping===c;
      return `<div class="leg ${swapping?'swapping':''}" data-s="ready">
        ${legimg()}
        <div class="body">${roomtag(c)}
          <div class="ttl">${m.title}</div>
          <div class="sub">${m.sub}</div></div>
        <div class="legctl">
          <button class="icbtn ${swapping?'active':''}" data-a="swapleg" data-c="${c}" title="${swapping?'Cancel swap':'Swap market'}" aria-label="${swapping?'Cancel swap':'Swap market'}">${swapping?IC.check:IC.swap}</button>
          <button class="icbtn" data-a="rmleg" data-c="${c}" title="Remove leg" aria-label="Remove leg"${s.legs.length<=1?' disabled':''}>${IC.x}</button>
        </div>
      </div>`;
    }).join("");
    const missing=PLAY.order.filter(c=>!s.legs.includes(c));
    let suggest;
    if(s.swapping&&s.legs.includes(s.swapping)){
      const c=s.swapping;
      const alts=MARKETS[c].map((m,mi)=>({m,mi})).filter(({mi})=>mi!==(s.mk[c]||0));
      const swapCards=alts.map(({m,mi})=>
        `<button class="sug" data-a="useswap" data-c="${c}" data-mi="${mi}">${legimg()}
          <span class="sug-b">${roomtag(c)}<span class="sug-t">${m.title}</span><span class="sug-s">${m.odds}</span>
            <span class="sug-add swap">${IC.check} Use</span></span></button>`);
      suggest=`<div class="suggest"><div class="suggest-h">Swap the ${ROOM[c].name} market</div><div class="suggrid">${swapCards.join("")}</div></div>`;
    }else{
      const addCards=missing.flatMap(c=>MARKETS[c].map((m,mi)=>
        `<button class="sug" data-a="addleg" data-c="${c}" data-mi="${mi}">${legimg()}
          <span class="sug-b">${roomtag(c)}<span class="sug-t">${m.title}</span><span class="sug-s">${m.odds}</span>
            <span class="sug-add">+ Add</span></span></button>`));
      suggest=addCards.length
        ? `<div class="suggest"><div class="suggest-h">Suggested to add</div><div class="suggrid">${addCards.join("")}</div></div>`
        : "";
    }
    return appbar()+`<div class="scroll"><div class="pad anim">
      <span class="kicker">Featured Combo-play</span>
      <h2 class="h-lg mt8">The Pereira Run</h2>
      <p class="txt">Hit on all legs across rooms to win.</p>
      <div class="card mt16" style="padding:14px">
        <div class="stack gap8">${legs}</div>
        ${suggest}
      </div>
      <div class="card mt16 stakesplit">
        <div class="stakecol">
          <span class="kicker" style="margin:0">Your stake</span>
          <div class="stepper sm mt12">
            <button data-a="stake" data-d="-5">–</button>
            <span class="val">$${s.stake}</span>
            <button data-a="stake" data-d="5">+</button>
          </div>
        </div>
        <div class="stakediv"></div>
        <div class="stakecol">
          <div class="mono muted" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase">To win · ${s.legs.length} ${s.legs.length===1?'room':'rooms'}</div>
          <div class="payline mt12"><span class="big">$${toWin(s.stake,s.legs)}</span></div>
        </div>
      </div>
      <button class="btn mt16" data-a="place">Place Combo-Play Bet · $${s.stake}</button>
    </div></div>`;
  },
  active(){
    const s=S.v1, cnt=s.legs.filter(c=>s.done[c]).length, all=cnt===s.legs.length;
    if(all)return completeScreen("You called it, landed it, and scored it.",s.legs);
    const legs=s.legs.map((c)=>{
      const done=s.done[c]; const cur=s.active===c; const m=mkt(c);
      return `<button class="leg" data-s="${cur?'ready':done?'done':'ready'}" data-a="leg" data-c="${c}" style="width:100%;text-align:left;cursor:pointer;background:${cur?'var(--surface)':'var(--panel)'}">
        ${legimg()}
        <div class="body">${roomtag(c)}
        <div class="ttl">${m.title}</div>
        <div class="sub">${done?'Resolved':cur?'Open — in room now':'Tap to enter '+ROOM[c].name}</div></div>
        <div class="st">${done?tick("done"):IC_arrow()}</div></button>`;
    }).join("");
    const rail=`<div class="rail">
      <div class="row between"><span class="rtag solid">${IC.cross}XRM SLIP</span>
        <span class="badge live">LIVE</span></div>
      <h3 class="h-md mt12">The Pereira Run</h3>
      <div class="mono muted" style="font-size:11.5px;margin-top:3px">Stake $${s.stake} · to win $${toWin(s.stake,s.legs)}</div>
      ${meter(cnt,all&&s.legs.length>=3)}
      <div class="stack gap8 mt16">${legs}</div>
      <div class="mono muted mt12" style="font-size:11px">${cnt}/${s.legs.length} rooms resolved</div>
    </div>`;
    let main;
    if(s.active){ main=this.roomPanel(s.active); }
    else{
      main=`<div class="main"><span class="kicker">Combo live</span>
        <h2 class="h-lg mt8">${s.legs.length===1?'One room to play.':s.legs.length+' rooms to play.'}</h2>
        <p class="txt">Tap a leg to play it. Your slip travels with you.</p></div>`;
    }
    return appbar(s.active)+`<div class="scroll"><div class="layout">${rail}${main}</div></div>`;
  },
  roomPanel(c){
    const s=S.v1, m=mkt(c);
    const body={
      PRE:`<p class="txt">Lock your call on the main event. This is one leg of your combo.</p>
        <div class="card flat mt16"><div class="row between"><span>${m.title}</span><span class="mono" style="font-weight:640">${m.odds}</span></div>
        <div class="hatch r-media mt12"><span class="lbl">Fight card · Pereira vs. Hill</span></div></div>`,
      COL:`<p class="txt">Rip your pack. A hit boosts the same ticket.</p>
        <div class="row gap10 mt16">${[0,1,2].map(i=>`<div class="hatch r-card" style="flex:1"><span class="lbl">Card ${i+1}</span></div>`).join("")}</div>`,
      PLY:`<p class="txt">Take the run to the table. Clear it to bank the whole combo.</p>
        <div class="hatch r-media mt16"><span class="lbl">${m.title} · seat open</span></div>`
    };
    return `<div class="main anim">
      <button class="btn ghost sm" data-a="back" style="margin-bottom:14px">← Back to slip</button>
      <div class="row gap8">${rtag(c,1)}<span class="badge">Leg ${s.legs.indexOf(c)+1} of ${s.legs.length}</span></div>
      <h2 class="h-lg mt12">${ROOM[c].verb}: ${m.title}</h2>
      ${body[c]}
      <button class="btn mt20" data-a="resolve" data-c="${c}">Resolve ${ROOM[c].name} leg →</button>
    </div>`;
  },
  on(a,ds){
    const s=S.v1;
    if(a==="enter"){s.stage="build";}
    else if(a==="stake"){s.stake=Math.max(5,s.stake+ +ds.d);}
    else if(a==="place"){s.placed=true;s.stage="active";}
    else if(a==="leg"){s.active=ds.c;}
    else if(a==="back"){s.active=null;}
    else if(a==="resolve"){s.done[ds.c]=true;s.active=null;toast(ROOM[ds.c].name+" leg resolved ✓");}
    else if(a==="rmleg"){ if(s.legs.length>1){ if(s.swapping===ds.c)s.swapping=null; s.legs=s.legs.filter(x=>x!==ds.c); toast(ROOM[ds.c].name+" removed"); } }
    else if(a==="addleg"){ if(!s.legs.includes(ds.c)){ if(ds.mi!==undefined)s.mk[ds.c]=+ds.mi; s.legs=PLAY.order.filter(x=>s.legs.includes(x)||x===ds.c); toast(ROOM[ds.c].name+" added"); } }
    else if(a==="swapleg"){ s.swapping=(s.swapping===ds.c?null:ds.c); }
    else if(a==="useswap"){ s.mk[ds.c]=+ds.mi; s.swapping=null; toast("Swapped the "+ROOM[ds.c].name+" market"); }
  }
};
function IC_arrow(){return '<span class="mono muted" style="font-size:15px">›</span>';}

/* ============================================================ V2 · RUN */
const V2={
  rungs(){
    const s=S.v2;
    // state per rung: done / ready(now) / locked
    const stt=c=>{
      if(c==="PRE")return s.step>=1?"done":"now";
      if(c==="COL")return s.step>=3?"done":s.step>=2?"now":"locked";
      if(c==="PLY")return s.step>=5?"done":s.step>=4?"now":"locked";
    };
    return PLAY.order.map((c,i)=>{
      const st=stt(c);
      return `<div class="leg" data-s="${st==='now'?'ready':st==='done'?'done':'locked'}">
        ${legimg()}
        <div class="body">${roomtag(c)}
        <div class="ttl">${PLAY.legs[c].short}</div>
        <div class="sub">${st==="locked"?"Unlocks from step "+i:st==="done"?"Cleared":"Now"}</div></div>
        <div class="st">${st==="done"?tick("done"):st==="locked"?tick("locked"):tick(i+1)}</div>
      </div>`;
    }).join("");
  },
  timeline(){
    const s=S.v2;
    const stt=c=>{
      if(c==="PRE")return s.step>=1?"done":"now";
      if(c==="COL")return s.step>=3?"done":s.step>=2?"now":"locked";
      if(c==="PLY")return s.step>=5?"done":s.step>=4?"now":"locked";
    };
    const nodes=PLAY.order.map((c,i)=>{const st=stt(c);
      return `<div class="node"><div class="dot ${st==='done'?'on':''} ${st==='now'?'now':''}">${st==='done'?'✓':i+1}</div>
        <div class="cap">${ROOM[c].name}</div></div>`;}).join("");
    return `<div class="timeline">${nodes}</div>`;
  },
  view(){
    const s=S.v2;
    if(s.step>=6||s.step===5)return completeScreen("The run held all the way through.");
    const rail=`<div class="rail">
      <div class="row between"><span class="rtag solid">${IC.cross}THE RUN</span>
        <span class="badge live">LIVE</span></div>
      <h3 class="h-md mt12">One play, three links</h3>
      <div class="mono muted" style="font-size:11.5px;margin-top:3px">Each link fuels the next</div>
      <div class="stack gap8 mt16">${this.rungs()}</div>
    </div>`;
    return appbar(this.activeRoom())+`<div class="scroll">
      <div style="max-width:1180px;margin:0 auto;padding:16px 20px 0">${this.timeline()}</div>
      <div class="layout">${rail}<div class="main">${this.main()}</div></div></div>`;
  },
  activeRoom(){const s=S.v2;return s.step<=1?"PRE":s.step<=3?"COL":"PLY";},
  main(){
    const s=S.v2;
    if(s.step===0)return `<div class="anim"><div class="row gap8">${rtag("PRE",1)}<span class="badge">Step 1 of 3</span></div>
      <h2 class="h-lg mt12">Call the fight.</h2>
      <p class="txt">Win by KO/TKO and your payout rolls straight into the next play.</p>
      <div class="card flat mt16"><div class="row between"><span>Pereira by KO / TKO · R2</span><span class="mono" style="font-weight:640">+600</span></div>
        <div class="hatch r-media mt12"><span class="lbl">Main event</span></div></div>
      <button class="btn mt20" data-a="next">Lock the call · $${ENTRY}</button></div>`;
    if(s.step===1)return `<div class="anim"><span class="badge solid">Step 1 cleared ✓</span>
      <h2 class="h-lg mt12">Called it. +$${SINGLE}.</h2>
      <p class="txt">Your $${SINGLE} is staged. Roll it into the UFC 299 pack.</p>
      <div class="card mt16"><div class="row between"><span class="mono muted" style="font-size:12px">Winnings staged</span><span class="mono" style="font-weight:640;font-size:18px">$${SINGLE}</span></div>
        <div class="row between mt8" style="font-family:var(--mono);font-size:12px"><span class="muted">→ funds</span><span>UFC 299 Pack</span></div></div>
      <button class="btn mt20" data-a="next">Roll $${SINGLE} into the pack →</button></div>`;
    if(s.step===2)return `<div class="anim"><div class="row gap8">${rtag("COL",1)}<span class="badge">Step 2 of 3</span></div>
      <h2 class="h-lg mt12">Land the pack.</h2>
      <p class="txt">Bought with the call. Whatever you pull becomes your table multiplier.</p>
      <div class="row gap10 mt16">${[0,1,2].map(i=>`<div class="hatch r-card" style="flex:1"><span class="lbl">Card ${i+1}</span></div>`).join("")}</div>
      <button class="btn mt20" data-a="next">Rip the pack →</button></div>`;
    if(s.step===3)return `<div class="anim"><span class="badge solid">Pereira rookie ✓</span>
      <h2 class="h-lg mt12">You pulled the rookie.</h2>
      <p class="txt">Your rookie converts to a ×1.5 table token.</p>
      <div class="card mt16 row gap12"><div class="hatch r-card" style="width:64px"><span class="lbl">RC</span></div>
        <div class="grow"><div style="font-weight:600">Pereira Rookie</div><div class="mono muted" style="font-size:12px">→ ×1.5 table token</div></div></div>
      <button class="btn mt20" data-a="next">Carry token to the table →</button></div>`;
    if(s.step===4)return `<div class="anim"><div class="row gap8">${rtag("PLY",1)}<span class="badge">Step 3 of 3</span></div>
      <h2 class="h-lg mt12">Score it.</h2>
      <p class="txt">Your ×1.5 token is live. Clear a 21 to bank the run.</p>
      <div class="hatch r-media mt16"><span class="lbl">Blackjack · token ×1.5 active</span></div>
      <button class="btn mt20" data-a="next">Play the hand →</button></div>`;
    return "";
  },
  on(a){const s=S.v2; if(a==="next"){s.step++; if(s.step===1)toast("Call hit · +$"+SINGLE); if(s.step===3)toast("Pulled: Pereira rookie"); if(s.step===5)toast("Cross-room bonus unlocked");}}
};

const V={v1:V1,v2:V2};

/* ---------- toast ---------- */
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1700);}

/* ---------- notes band ---------- */
function renderNotes(){
  const m=META[S.v];
  $("#notesband").innerHTML=`<div class="tray-title">${m.code} · ${m.name}</div>
    <div class="tray-pattern">${m.pattern}</div>
    <div class="tray-sec"><span class="tag">The object</span><p>${m.note}</p></div>
    <div class="tray-sec"><span class="tag">Why this concept</span><p>${m.move}</p></div>
    <div class="tray-sec"><span class="tag">Considerations</span><p>${m.risk}</p></div>`;
}

/* ---------- paint ---------- */
function paint(){
  app.innerHTML=V[S.v].view();
  renderNotes();
  document.querySelectorAll("#varlist button").forEach(b=>b.setAttribute("data-on",b.dataset.v===S.v?"true":"false"));
  $("#notesbtn").classList.toggle("on",S.notes);
  xrm.setAttribute("data-notes",S.notes?"on":"off");
  $("#devtools").setAttribute("data-notes",S.notes?"on":"off");
  document.querySelectorAll(".legimg").forEach(el=>{ el.style.width=el.getBoundingClientRect().height+"px"; });
}

/* Stake +/- only ever changes two numbers on screen — update them in place
   instead of re-rendering, so nothing else reflows or replays its enter animation. */
function updateStakeUI(){
  const s=S.v1;
  const val=$(".stepper.sm .val"); if(val)val.textContent="$"+s.stake;
  const big=$(".stakecol .payline .big"); if(big)big.textContent="$"+toWin(s.stake,s.legs);
  const cta=$('[data-a="place"]'); if(cta)cta.textContent="Place Combo-Play Bet · $"+s.stake;
}

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="restart"){reset(S.v);paint();return;}
  V[S.v].on&&V[S.v].on(a,t.dataset);
  if(a==="stake"&&S.v==="v1"&&S.v1.stage==="build"){ updateStakeUI(); return; }
  paint();
});

/* ---------- review bar ---------- */
const varlist=$("#varlist");
varlist.innerHTML=ORDER.map(v=>{const m=META[v];
  return `<button data-v="${v}" data-on="${v===S.v?'true':'false'}">${m.name}</button>`;}).join("");
varlist.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S.v=b.dataset.v;reset(S.v);paint();});
$("#notesbtn").addEventListener("click",()=>{
  S.notes=!S.notes;
  renderNotes();
  $("#notesbtn").classList.toggle("on",S.notes);
  xrm.setAttribute("data-notes",S.notes?"on":"off");
  $("#devtools").setAttribute("data-notes",S.notes?"on":"off");
});
$("#restart").addEventListener("click",()=>{reset(S.v);paint();});
// visual-style switch — swaps skin tokens only, never touches flow/state
document.documentElement.setAttribute("data-skin","");
$("#skinswitch").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.documentElement.setAttribute("data-skin",b.dataset.skin);
  $("#skinswitch").querySelectorAll("button").forEach(x=>x.setAttribute("data-on",x===b?"true":"false"));
});

let resizeT;
window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{
  document.querySelectorAll(".legimg").forEach(el=>{ el.style.width=el.getBoundingClientRect().height+"px"; });
},120);});

paint();
})();
</script>
